  const resTable = `<h3>資源 (備蓄 と 年あたりの増減)</h3><div class="scroll"><table class="tbl">
    <tr><th>星系</th>${RES.map((r) => `<th>${RES_LABEL[r]}</th>`).join('')}</tr>${resRows}
    <tr class="total"><td>合計</td>${RES.map((r) => `<td>${fmtAmt(totals[r])} <small>${signed(totalNet[r])}</small></td>`).join('')}</tr></table></div>
    <p class="note">増減は生産−需要。交易路での出入りは含まない。</p>`;

  const milIds = [...new Set([...systems.map((s) => s.id), ...Object.keys(g.garrison).map(Number).filter((id) => g.garrison[id] > 0)])];
  const milRows = milIds.map((id) => {
    const s = g.system(id);
    const n = g.garrison[id] || 0;
    const coming = g.fleets.filter((f) => f.to === id).reduce((k, f) => k + f.n, 0);
    const build = g.isColonized(id) && g.hasShipyard(id)
      ? costButton(g, `data-act="warship" data-sys="${id}"`, '建造', WARSHIP_COST, id)
      : '<span class="muted">造船所なし</span>';
    return `<tr><td>${goto(s)}</td><td><b>${n}</b> 隻${coming ? ` <span class="muted">(+${coming} 向かっている)</span>` : ''}</td><td>${build}</td>
      <td><button data-act="rally" data-sys="${id}">全艦をここへ集結</button></td></tr>`;
  }).join('');
  const milTable = `<h3>軍事</h3><div class="scroll"><table class="tbl">
    <tr><th>星系</th><th>駐留</th><th>軍艦の建造</th><th></th></tr>${milRows}</table></div>
    ${g.year < PIRATE_START ? `<p class="note">宇宙海賊は ${PIRATE_START} 年から現れる。</p>` : ''}`;

  return `<h2>帝国</h2>${kpi}${ledger}${popTable}${resTable}${milTable}`;
}

const EVENT_KIND = { famine: '飢餓・水不足', shortage: '資源不足', pirate: '海賊', natives: '先住民', colony: '入植' };

// イベントタブ: いま起きている問題と、重要なイベントの履歴
function eventsHtml(app) {
  const g = app.game;
  const f = app.eventFilter || 'all';
  const ALERT = { food: ['famine', '飢餓'], water: ['famine', '水不足'], goods: ['shortage', '工業品不足'], industry: ['shortage', '原料不足'] };
  const now = g.colonies.flatMap((c) => Object.entries(c.alerts || {}).filter(([, on]) => on).map(([k]) => ({ c, k })));
  const nowHtml = now.length
    ? now.map(({ c, k }) => `<div class="ev"><span class="tag ${ALERT[k][0]}">${ALERT[k][1]}</span><span class="txt">${esc(c.name)}
        <span class="muted">人口 ${fmtPop(c.pop)}・${((c.growth || 0) * 100).toFixed(1)}%/年</span></span>
        <button data-act="gobody" data-sys="${c.sys}" data-body="${esc(c.body)}">表示</button></div>`).join('')
    : '<p class="note">いま問題が起きている入植地はない。</p>';
  const chips = ['all', ...Object.keys(EVENT_KIND)].map((k) => `<button data-act="evfilter" data-f="${k}" class="${k === f ? 'on' : ''}">${k === 'all' ? 'すべて' : EVENT_KIND[k]}</button>`).join('');
  const list = g.events.filter((e) => f === 'all' || e.kind === f).slice(0, 120).map((e) => `<div class="ev ${e.good ? 'good' : ''}">
      <span class="yr">${e.year.toFixed(1)}</span><span class="tag ${e.kind}">${EVENT_KIND[e.kind] || e.kind}</span>
      <span class="txt">${esc(e.text)}</span>${e.sys !== undefined && g.system(e.sys) ? `<button data-act="goto" data-sys="${e.sys}">地図</button>` : ''}</div>`).join('');
  return `<h2>イベント</h2>
    <h3>いま起きている問題 (${now.length})</h3>${nowHtml}
    <h3>履歴</h3><div class="chips">${chips}</div>${list || '<p class="note">まだ記録はない。</p>'}`;
}

// 候補地タブ: ハビタブルゾーン内にある未入植の天体
function candidatesHtml(app) {
  const g = app.game;
  const origins = g.colonizedSystems();
  const rows = [];
  for (const sys of g.galaxy.systems) {
    for (const b of sys.bodies) {
      if (!b.inHZ || b.type === 'belt' || g.colonyAt(sys.id, b.id, 'planet') || g.colonyAt(sys.id, b.id, 'station')) continue;
      const grade = b.settle?.grade || 0;
      if (app.candOnly && grade < 1) continue;
      let from = origins[0];
      for (const o of origins) if (distance(o, sys) < distance(from, sys)) from = o;
      rows.push({ sys, b, grade, from, d: distance(from, sys) });
    }
  }
  const sort = app.candSort || 'dist';
  rows.sort(sort === 'grade' ? (x, y) => y.grade - x.grade || x.d - y.d : (x, y) => x.d - y.d);
  const stars = (v) => '★'.repeat(clamp(Math.ceil(v / 0.6), 1, 4));
  const body = rows.slice(0, 100).map(({ sys, b, grade, from, d }) => {
    const solid = b.type === 'rocky' || b.type === 'dwarf';
    let nat = '<span class="muted">未調査</span>';
    if (g.isSurveyed(sys.id)) {
      const n = g.nativeOf(sys.id, b.id);
      nat = n ? `<span class="nat">${esc(n.def.species)}</span> <span class="muted">${nativeStatus(n)}</span>` : 'なし';
    }
    const res = MINED.filter((r) => b.deposits?.[r] > 0.05).map((r) => `${RES_LABEL[r]}${stars(b.deposits[r])}`).join(' ') || '—';
    const kind = grade >= 1 ? 'planet' : 'station';
    const c = g.check(sys.id, b.id, kind);
    const send = costButton(g, `data-act="candsend" data-sys="${sys.id}" data-body="${esc(b.id)}" data-kind="${kind}" data-from="${from.id}"`,
      kind === 'planet' ? '入植船' : 'ステーション', SHIP_COST[kind], from.id, c.ok ? '' : c.reason);
    return `<tr><td><button data-act="gobody" data-sys="${sys.id}" data-body="${esc(b.id)}">${esc(b.name)}</button></td>
      <td>${d.toFixed(1)} ly <span class="muted">(${esc(from.name)})</span></td><td>${TYPE_LABEL[b.type]}</td>
      <td>${solid ? `<b class="grade g${grade}">${GRADE_LABEL[grade]}</b>` : '<span class="muted">地表なし</span>'}</td>
      <td>${solid ? `${Math.round(b.tSurf - 273)} ℃` : '—'}</td><td>${fmt(b.gravity)} g</td>
      <td>${solid ? (b.pressure < 0.001 ? '真空' : `${fmt(b.pressure)} atm`) : '—'}</td>
      <td>${nat}</td><td>${res}</td><td>${send}</td></tr>`;
  }).join('');
  return `<h2>候補地 <span class="muted" style="font-size:13px">ハビタブルゾーン内の未入植の天体 ${rows.length} 件${rows.length > 100 ? ' (近い順に100件を表示)' : ''}</span></h2>
    <div class="bulk">
      <label class="check"><input type="checkbox" data-act="candonly" ${app.candOnly ? 'checked' : ''}> 地表に入植できる天体だけ</label>
      並び順 <select data-act="candsort"><option value="dist" ${sort === 'dist' ? 'selected' : ''}>最寄りの入植地から近い順</option><option value="grade" ${sort === 'grade' ? 'selected' : ''}>入植適性の高い順</option></select>
    </div>
    <div class="scroll"><table class="tbl">
      <tr><th>天体</th><th>最寄りの入植地から</th><th>種類</th><th>入植適性</th><th>気温</th><th>重力</th><th>大気圧</th><th>先住民</th><th>資源</th><th>入植船を送る</th></tr>
      ${body}</table></div>
    <p class="note">入植船は最寄りの入植地から出る。地表に入植できない天体には宇宙ステーションを送る。</p>`;
}

const SHEETS = { empire: empireHtml, events: eventsHtml, cands: candidatesHtml };

// --- セーブ(localStorage) ---
const SAVE_KEY = 'moribin-save-v1';
function buildSave(game, extra = {}) {
  return {
    v: 1, seed: game.galaxy.seed, year: game.year, colonies: game.colonies, ships: game.ships,
    log: game.log, nextShipId: game.nextShipId, credits: game.credits, stock: game.stock, routes: game.routes,
    cargo: game.cargo, projects: game.projects, events: game.events, garrison: game.garrison, fleets: game.fleets, natives: game.natives, infamy: game.infamy,
    surveyed: game.surveyed, savedAt: Date.now(), ...extra,
  };
}
function parseSave(text) {
  try {
    const d = JSON.parse(text);
    return d && typeof d === 'object' && d.seed !== undefined && Number.isFinite(d.year) ? d : null;
  } catch { return null; }
}
function writeSave(game, extra) {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(buildSave(game, extra))); return true; } catch { return false; }
}
function readSave() {
  try { const t = localStorage.getItem(SAVE_KEY); return t ? parseSave(t) : null; } catch { return null; }
}
function clearSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch { /* 保存できない環境では無視 */ }
}
// セーブデータを読み込んで現在のゲームに反映する。失敗時は現在の状態を保つ。
function loadSave(d) {
  const prev = app.game;
  newGame(d.seed);
  if (app.game.restore(d)) {
    app.speed = SPEEDS.includes(d.speed) ? d.speed : 1;
    updateSpeedButtons();
    return true;
  }
  app.game = prev;
  return false;
}

function save() {
  const ok = writeSave(app.game, { speed: app.speed });
  $('savestat').textContent = ok ? `自動セーブ済み ${app.game.year.toFixed(1)}年` : 'セーブ不可(この環境では保存できません)';
}

$('savenow').onclick = () => { save(); app.game.message('セーブした。'); };
$('export').onclick = () => {
  const blob = new Blob([JSON.stringify(buildSave(app.game, { speed: app.speed }))], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `moribin-${app.game.year.toFixed(0)}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('import').onclick = () => $('importfile').click();
$('importfile').onchange = async (e) => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  const d = parseSave(await f.text());
  if (d && loadSave(d)) { save(); app.game.message('セーブデータを読み込んだ。'); }
  else app.game.message('セーブデータを読み込めなかった。');
};
setInterval(save, 5000);
window.addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
const setSpeed = (v) => {

document.querySelectorAll('[data-speed]').forEach((b) => {

}
window.addEventListener('keydown', (e) => {

  else if (e.key >= '1' && e.key <= String(SPEEDS.length)) setSpeed(SPEEDS[Number(e.key) - 1]);
  else if (e.key === 'g') app.setView('galaxy');
  else if (e.key === 's') app.setView('system');
  else if (e.key === 'e') app.setView('empire');
  else if (e.key === 'Escape') app.setView('galaxy');
});

const panel = $('panel');
const empire = $('empire');
function onPanelClick(e) {
  const li = e.target.closest('li[data-body]');
  if (li) return app.selectBody(li.dataset.body);
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const { act, kind } = btn.dataset;
  const g = app.game;
  const sys = btn.dataset.sys !== undefined ? Number(btn.dataset.sys) : app.sel.sys;
  const body = btn.dataset.body ?? app.sel.body;
  if (act === 'open') return app.setView('system');
  if (act === 'goto') { app.selectSystem(sys); return app.setView('galaxy'); }
  if (act === 'gobody') { app.openSystem(sys); return app.selectBody(body); }
  if (act === 'evfilter') { app.eventFilter = btn.dataset.f; app.dirty = true; return; }
  if (act === 'back') return app.selectBody(null);
  const actions = {
    send: () => g.dispatch(app.originId ?? nearestOrigin(), sys, body, kind),
    upgrade: () => g.upgrade(g.colonyByKey(btn.dataset.col), btn.dataset.fac),
    route: () => g.openRoute(sys, Number(btn.dataset.dest)),
    uproute: () => g.upgradeRoute(g.routes.find((r) => r.id === Number(btn.dataset.route))),
    warship: () => g.buildWarship(sys),
    fleet: () => g.sendFleet(Number(btn.dataset.from), sys, btn.dataset.n === 'all' ? Infinity : Number(btn.dataset.n)),
    gift: () => g.gift(sys, body),
    integrate: () => g.integrate(sys, body),
    conquer: () => g.conquer(sys, body),
    rally: () => g.rally(sys),
    candsend: () => g.dispatch(Number(btn.dataset.from), sys, body, kind),
    bulkfocus: () => g.setFocusAll(app.bulkFocus || 'balanced'),
  };
  if (!actions[act]) return;
  const r = actions[act]();
  if (!r.ok) g.message(`できない: ${r.reason}`);
  app.dirty = true;
  save();
}
function onPanelChange(e) {
  const { act, col } = e.target.dataset;
  const v = e.target.value;
  if (act === 'origin') app.originId = Number(v);
  else if (act === 'rdest') app.routeDest = Number(v);
  else if (act === 'forigin') app.fleetOrigin = Number(v);
  else if (act === 'bulkfocus') app.bulkFocus = v;
  else if (act === 'candonly') app.candOnly = e.target.checked;
  else if (act === 'candsort') app.candSort = v;
  else if (act === 'focus') {
    const c = app.game.colonyByKey(col);
    if (c && FOCUS[v]) { c.focus = v; app.game.message(`${c.name} の方針を「${FOCUS[v].label}」にした`); }
  } else return;
  e.target.blur();
  app.dirty = true;
}
// 数値は刻々と変わるのでパネルを定期的に描き直す。ただし操作中(押している・選択肢を開いている)は待つ
let panelHeld = false;
for (const el of [panel, empire]) {
  el.addEventListener('click', onPanelClick);
  el.addEventListener('change', onPanelChange);

window.addEventListener('pointerup', () => { panelHeld = false; });

const panelBusy = () => panelHeld || document.activeElement?.tagName === 'SELECT';
function nearestOrigin() {
  const g = app.game;
  return g.colonizedSystems().sort((a, b) => g.travelYears(a.id, app.sel.sys) - g.travelYears(b.id, app.sel.sys))[0].id;

// --- メインループ ---
let last = performance.now();
let acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  const game = app.game;
  if (app.speed && game.advance(dt * app.speed)) app.dirty = true;
  const ctx = galaxyView.ctx;
  ctx.fillStyle = '#05070d';
  ctx.fillRect(0, 0, w, h);
  if (app.view === 'galaxy') galaxyView.draw(w, h);
  else if (app.view === 'system') systemView.draw(w, h);

  $('date').textContent = `西暦 ${Math.floor(game.year)}年 ${Math.floor((game.year % 1) * 12) + 1}月`;
  acc += dt;
  if (acc > 0.5) {
    acc = 0;
    $('ships').innerHTML = shipsHtml(game);
    $('log').innerHTML = logHtml(game);
    $('treasury').innerHTML = treasuryHtml(game);
    $('ledger').innerHTML = ledgerHtml(game);
    if (app.view === 'events') app.seenEvent = game.events[0]?.id || 0;
    const unseen = game.events.filter((e) => !e.good && e.id > (app.seenEvent || 0)).length;
    $('tab-events').textContent = unseen ? `イベント (${unseen})` : 'イベント';
    app.dirty = true;
  }
  if (app.dirty && !panelBusy()) {
    app.dirty = false;
    panel.innerHTML = app.view === 'system' && app.sel.body ? bodyPanel(app) : systemPanel(app);
    if (SHEETS[app.view]) empire.innerHTML = SHEETS[app.view](app);
  }
  requestAnimationFrame(frame);
}

resize();
const saved = readSave();
const wanted = params.get('seed');
if (saved && (wanted === null || wanted === String(saved.seed))) {
  if (loadSave(saved)) app.game.message('セーブデータをロードした。');
  else newGame(wanted || String(Math.floor(Math.random() * 1e6))); // 壊れたデータは破棄
} else {
  newGame(wanted || String(Math.floor(Math.random() * 1e6)));
}
updateSpeedButtons();
save();
requestAnimationFrame(frame);
window.__app = app; // デバッグ用

</script>
