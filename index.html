<script>
// シード付き乱数 (mulberry32)。同じシードなら同じ銀河が生成される。
function hashSeed(str) {
  let h = 2166136261;
  for (const c of String(str)) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return h >>> 0;
}

class Rng {
  constructor(seed) {
    this.state = seed >>> 0;
  }
  next() {
    this.state = (this.state + 0x6d2b79f5) >>> 0;
    let t = this.state;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  range(a, b) { return a + (b - a) * this.next(); }
  int(a, b) { return Math.floor(this.range(a, b + 1)); }
  chance(p) { return this.next() < p; }
  pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
  logUniform(a, b) { return Math.exp(this.range(Math.log(a), Math.log(b))); }
  normal(mu = 0, sigma = 1) {
    const u = 1 - this.next();
    const v = this.next();
    return mu + sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  poisson(lambda) {
    const L = Math.exp(-lambda);
    let k = 0;
    let p = 1;
    do { k++; p *= this.next(); } while (p > L);
    return k - 1;
  }
  weighted(items, weightOf) {
    const total = items.reduce((s, it) => s + weightOf(it), 0);
    let r = this.next() * total;
    for (const it of items) {
      r -= weightOf(it);
      if (r <= 0) return it;
    }
    return items[items.length - 1];
  }
}

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

// 恒星の生成。スペクトル型の存在比・質量・光度は現実の近傍星の統計に準拠。


// weight: 個数比(%)。O型は実際に 0.00003% 程度しかない。
// skew: 質量範囲内で軽い側に偏らせる指数 (初期質量関数の近似)
const CLASSES = [
  { cls: 'O', lo: 16, hi: 60, weight: 0.00003, skew: 1.5 },
  { cls: 'B', lo: 2.1, hi: 16, weight: 0.13, skew: 2 },
  { cls: 'A', lo: 1.4, hi: 2.1, weight: 0.6, skew: 1.3 },
  { cls: 'F', lo: 1.04, hi: 1.4, weight: 3, skew: 1.2 },
  { cls: 'G', lo: 0.8, hi: 1.04, weight: 7.6, skew: 1 },
  { cls: 'K', lo: 0.45, hi: 0.8, weight: 12.1, skew: 1 },
  { cls: 'M', lo: 0.08, hi: 0.45, weight: 73, skew: 1.8 },
  { cls: 'WD', weight: 3.5 }, // 白色矮星
];

// 近接連星・多重星になる確率 (Raghavan+2010 などの概数)
const MULTIPLICITY = { O: 0.9, B: 0.8, A: 0.7, F: 0.5, G: 0.44, K: 0.41, M: 0.27, WD: 0.3 };

const SOLAR_TEMP = 5772;

const lumFromMass = (m) =>
  m < 0.43 ? 0.23 * m ** 2.3 : m < 2 ? m ** 4 : m < 55 ? 1.4 * m ** 3.5 : 32000 * m;
const radiusFromMass = (m) => (m < 1 ? m ** 0.8 : m ** 0.57);

function tempToColor(T) {
  const t = clamp(T, 1000, 40000) / 100;
  let r, g, b;
  if (t <= 66) {
    r = 255;
    g = 99.4708025861 * Math.log(t) - 161.1195681661;
    b = t <= 19 ? 0 : 138.5177312231 * Math.log(t - 10) - 305.0447927307;
  } else {
    r = 329.698727446 * (t - 60) ** -0.1332047592;
    g = 288.1221695283 * (t - 60) ** -0.0755148492;
    b = 255;
  }
  const c = (v) => Math.round(clamp(v, 0, 255));
  return `rgb(${c(r)},${c(g)},${c(b)})`;
}

function mainSequence(cls, mass) {
  const def = CLASSES.find((c) => c.cls === cls);
  const lum = lumFromMass(mass);
  const radius = radiusFromMass(mass);
  const temp = SOLAR_TEMP * (lum / radius ** 2) ** 0.25;
  const sub = clamp(Math.floor((10 * (def.hi - mass)) / (def.hi - def.lo)), 0, 9);
  return { cls, label: `${cls}${sub} V`, mass, radius, lum, temp, color: tempToColor(temp), wd: false };
}

function whiteDwarf(rng) {
  const mass = clamp(rng.normal(0.6, 0.12), 0.4, 1.1);
  const radius = 0.0115 * (0.6 / mass) ** (1 / 3);
  const temp = 4000 + 21000 * rng.next() ** 3; // 古いものほど数が多く冷たい
  const lum = radius ** 2 * (temp / SOLAR_TEMP) ** 4;
  return {
    cls: 'WD', label: `DA${(50400 / temp).toFixed(1)}`, mass, radius, lum, temp,
    color: tempToColor(temp), wd: true,
  };
}

function classOfMass(m) {
  return CLASSES.find((c) => c.lo !== undefined && m >= c.lo && m < c.hi)?.cls ?? (m < 0.08 ? 'M' : 'O');
}

// 主星を生成する。
function makePrimary(rng) {
  const def = rng.weighted(CLASSES, (c) => c.weight);
  if (def.cls === 'WD') return whiteDwarf(rng);
  const mass = def.lo + (def.hi - def.lo) * rng.next() ** def.skew;
  return mainSequence(def.cls, mass);
}

// 伴星(0〜2個)を生成する。sep は主星との距離[AU] (対数正規分布、中央値≈30AU)。
function makeCompanions(rng, primary) {
  if (!rng.chance(MULTIPLICITY[primary.cls])) return [];
  const n = rng.chance(0.2) ? 2 : 1;
  const out = [];
  for (let i = 0; i < n; i++) {
    const mass = Math.max(0.08, primary.mass * rng.range(0.15, 1));
    const star = mainSequence(classOfMass(mass), mass);
    const sep = clamp(10 ** rng.normal(1.5, 1.3), 0.05, 20000) * (i + 1);
    out.push({ star, sep, phase: rng.range(0, Math.PI * 2) });
  }
  return out.sort((a, b) => a.sep - b.sep);
}

// 惑星(天体)の生成と物理量の計算。単位: 距離=AU, 質量/半径=地球比, 時間=年。


const PLANETS_MEAN = { M: 3.2, K: 3.5, G: 3.5, F: 3, A: 2, B: 0.8, O: 0, WD: 1.2 };

// 平衡温度[K] (アルベド込み)
const eqTemp = (lum, a, albedo) => (278.6 * ((1 - albedo) * lum) ** 0.25) / Math.sqrt(a);

const frostLine = (star) => (star.wd ? 3 : 2.7 * Math.sqrt(star.lum));
const habitableZone = (star) => ({ inner: 0.95 * Math.sqrt(star.lum), outer: 1.37 * Math.sqrt(star.lum) });

function pickType(rng, x) {
  const table =
    x < 0.5 ? [['rocky', 0.68], ['mini-neptune', 0.27], ['gas-giant', 0.05]]
    : x < 1.2 ? [['rocky', 0.55], ['mini-neptune', 0.3], ['gas-giant', 0.15]]
    : x < 8 ? [['gas-giant', 0.35], ['ice-giant', 0.22], ['rocky', 0.18], ['dwarf', 0.15], ['mini-neptune', 0.1]]
    : [['dwarf', 0.4], ['ice-giant', 0.25], ['rocky', 0.15], ['gas-giant', 0.1], ['mini-neptune', 0.1]];
  return rng.weighted(table, (e) => e[1])[0];
}

function physical(rng, type) {
  switch (type) {
    case 'dwarf': {
      const mass = rng.logUniform(0.0005, 0.05);
      return { mass, radius: mass ** 0.3, albedo: rng.range(0.1, 0.6) };
    }
    case 'rocky': {
      const mass = rng.logUniform(0.05, 8);
      return { mass, radius: mass < 1 ? mass ** 0.3 : mass ** 0.27, albedo: rng.range(0.1, 0.45) };
    }
    case 'mini-neptune': {
      const mass = rng.logUniform(2, 10);
      return { mass, radius: 1.6 + (2 * Math.log10(mass / 2)) / Math.log10(5), albedo: rng.range(0.2, 0.5) };
    }
    case 'ice-giant': {
      const mass = rng.logUniform(8, 40);
      return { mass, radius: 3.9 * (mass / 16) ** 0.3, albedo: rng.range(0.25, 0.5) };
    }
    default: {
      const mass = rng.logUniform(30, 1500);
      return { mass, radius: clamp(7 + 1.7 * Math.log10(mass), 8, 12.5), albedo: rng.range(0.3, 0.55) };
    }
  }
}

// 大気圧[atm]。脱出速度が大きく温度が低いほど大気を保持しやすい。
function atmosphere(rng, mass, radius, teq) {
  const index = (mass / radius / (teq / 255)) * rng.logUniform(0.1, 10);
  return index < 0.05 ? 0 : 0.6 * index ** 1.6 * rng.logUniform(0.3, 3);
}

const greenhouse = (p) => 1 + 0.1 * Math.log10(1 + 10 * p) + (p > 10 ? 0.5 * Math.log10(p / 10) : 0);

function classifySurface(t, p, water) {
  if (t > 1000) return 'molten';
  if (t > 450) return 'scorched';
  if (t < 200) return 'frozen';
  if (t >= 253 && t <= 373 && p >= 0.3 && p <= 5 && water > 0.2) return water > 0.7 ? 'ocean' : 'temperate';
  return p < 0.01 ? 'barren' : 'desert';
}

// 惑星入植の適性。ドーム/地下都市前提の「住みやすさ」で、テラフォーミング前の状態を評価する。
function settleability(b) {
  if (b.type !== 'rocky' && b.type !== 'dwarf') {
    return { grade: 0, score: 0, notes: ['固体の地表がない'] };
  }
  const g = b.gravity;
  const t = b.tSurf;
  const p = b.pressure;
  const gs = g < 0.7 ? clamp((g - 0.1) / 0.6, 0, 1) : g > 1.3 ? clamp((2.5 - g) / 1.2, 0, 1) : 1;
  const ts = t < 273 ? clamp((t - 150) / 123, 0, 1) : t > 303 ? clamp((400 - t) / 97, 0, 1) : 1;
  const ps = p < 0.01 ? 0.15 : p < 0.5 ? 0.15 + (0.85 * (p - 0.01)) / 0.49 : p <= 3 ? 1 : clamp(1 - (p - 3) / 17, 0, 1);
  const ws = clamp(b.water, 0, 1);
  const score = 0.35 * gs + 0.35 * ts + 0.2 * ps + 0.1 * ws;
  const notes = [];
  if (g > 2.5) notes.push('重力が強すぎる');
  if (t > 600) notes.push('高温すぎる');
  if (t < 40) notes.push('極低温');
  const hardNo = g > 2.5 || t > 600 || t < 40;
  const earthlike = score >= 0.9 && p >= 0.5 && p <= 3 && b.water > 0.4 && g >= 0.7 && g <= 1.5;
  const grade = hardNo ? 0 : earthlike ? 3 : score >= 0.65 ? 2 : score >= 0.3 ? 1 : 0;
  if (!hardNo && grade === 0) notes.push('環境が過酷すぎる');
  return { grade, score, notes };
}

// 共通の派生量を計算して天体を完成させる。
function finalizeBody(body, star) {
  body.period = Math.sqrt(body.a ** 3 / star.mass);
  body.tidalLock = body.a < 0.25 * Math.cbrt(star.mass) && body.type !== 'belt';
  const hz = habitableZone(star);
  body.inHZ = body.a >= hz.inner && body.a <= hz.outer;
  if (body.type === 'belt') {
    body.tSurf = eqTemp(star.lum, body.a, 0.1);
    body.settle = { grade: 0, score: 0, notes: ['小天体の集まりで入植に適した地表がない'] };
    return body;
  }
  body.gravity = body.mass / body.radius ** 2;
  body.teq = eqTemp(star.lum, body.a, body.albedo);
  if (body.pressure === undefined) body.pressure = 0;
  if (body.tSurf === undefined) body.tSurf = body.teq * greenhouse(body.pressure);
  if (body.type === 'rocky' || body.type === 'dwarf') {
    body.surface = classifySurface(body.tSurf, body.pressure, body.water);
  }
  body.settle = settleability(body);
  return body;
}

// 主星まわりの惑星系を生成する。maxA: 軌道が安定に保てる最大半径[AU] (伴星が近いと小さい)。
function generatePlanets(rng, star, sysName, maxA) {
  if (maxA < 0.1) return [];
  const count = Math.min(9, rng.poisson(PLANETS_MEAN[star.cls]));
  const frost = frostLine(star);
  let a = star.wd ? rng.logUniform(1, 10) : rng.logUniform(0.05, 0.5) * star.lum ** 0.25;
  const bodies = [];
  for (let i = 0; i < count && a <= maxA; i++, a *= rng.range(1.4, 2.2)) {
    const type = pickType(rng, a / frost);
    const b = { type, a, phase: rng.range(0, Math.PI * 2), ...physical(rng, type), water: 0 };
    if (type === 'rocky' || type === 'dwarf') {
      const teq = eqTemp(star.lum, a, b.albedo);
      b.pressure = type === 'dwarf' && teq > 120 ? 0 : atmosphere(rng, b.mass, b.radius, teq);
      b.water = rng.next() ** 1.5;
    }
    bodies.push(b);
  }
  // 小惑星帯: 雪線付近に確率的に置く(近すぎる惑星があれば作らない)
  const beltA = frost * rng.range(0.9, 1.3);
  if (!star.wd && beltA < maxA && rng.chance(0.45) && bodies.every((b) => Math.abs(Math.log(b.a / beltA)) > 0.25)) {
    bodies.push({ type: 'belt', a: beltA, phase: rng.range(0, Math.PI * 2) });
  }
  bodies.sort((x, y) => x.a - y.a);
  let letter = 'b'.charCodeAt(0);
  bodies.forEach((b) => {
    if (b.type === 'belt') {
      b.id = `belt${b.a.toFixed(2)}`;
      b.name = `${sysName} 小惑星帯`;
    } else {
      const l = String.fromCharCode(letter++);
      b.id = l;
      b.name = `${sysName} ${l}`;
    }
    finalizeBody(b, star);
  });
  return bodies;
}

// 太陽系(実データ)。ゲームの開始地点。



const sun = {
  cls: 'G', label: 'G2 V', mass: 1, radius: 1, lum: 1, temp: 5772,
  color: tempToColor(5772), wd: false,
};

const P = (id, name, type, a, mass, radius, extra = {}) => ({
  id, name, type, a, mass, radius, albedo: 0.3, water: 0, pressure: 0, phase: 0, ...extra,
});

function makeSol() {
  const bodies = [
    P('mercury', '水星', 'rocky', 0.387, 0.055, 0.383, { albedo: 0.09, tSurf: 440, surface: 'barren' }),
    P('venus', '金星', 'rocky', 0.723, 0.815, 0.949, { albedo: 0.77, pressure: 92, tSurf: 737, surface: 'scorched' }),
    P('earth', '地球', 'rocky', 1, 1, 1, { albedo: 0.3, pressure: 1, water: 0.71, tSurf: 288, surface: 'temperate' }),
    P('mars', '火星', 'rocky', 1.524, 0.107, 0.532, { albedo: 0.25, pressure: 0.006, tSurf: 210, surface: 'desert' }),
    P('belt', '小惑星帯', 'belt', 2.77, 0, 0),
    P('jupiter', '木星', 'gas-giant', 5.2, 318, 11.2, { albedo: 0.5 }),
    P('saturn', '土星', 'gas-giant', 9.58, 95, 9.45, { albedo: 0.34 }),
    P('uranus', '天王星', 'ice-giant', 19.2, 14.5, 4, { albedo: 0.3 }),
    P('neptune', '海王星', 'ice-giant', 30.07, 17.1, 3.88, { albedo: 0.29 }),
    P('pluto', '冥王星', 'dwarf', 39.5, 0.0022, 0.186, { albedo: 0.5, tSurf: 44, surface: 'frozen' }),
  ];
  bodies.forEach((b, i) => {
    b.phase = i * 2.1; // 見た目用の初期位相
    const keep = { surface: b.surface, tSurf: b.tSurf };
    finalizeBody(b, sun);
    Object.assign(b, Object.fromEntries(Object.entries(keep).filter(([, v]) => v !== undefined)));
  });
  return { name: '太陽系 (Sol)', star: sun, bodies };
}

// 星間マップの自動生成。
// 星の配置: ディスク状の領域に最小間隔つきランダム配置 → 「最近接星までの平均距離」が
// ちょうど meanSpacing[ly] になるよう全体を一様スケーリングする。





const SYL_A = ['ka', 've', 'lo', 'ri', 'sa', 'tu', 'ne', 'mi', 'zo', 'ar', 'el', 'or', 'da', 'phi', 'xe', 'yu', 'ha', 'bo', 'gi', 'ce'];
const SYL_B = ['ra', 'ta', 'nis', 'lon', 'dor', 'ria', 'sor', 'ven', 'mus', 'tan', 'lis', 'gar', 'pha', 'kon', 'dis', 'rix'];
const SYL_C = ['', '', '', 'a', 'is', 'on', 'ae', 'us'];

function makeNamer(rng) {
  const used = new Set(['Sol']);
  return () => {
    for (;;) {
      let n = rng.pick(SYL_A) + (rng.chance(0.5) ? rng.pick(SYL_A) : '') + rng.pick(SYL_B) + rng.pick(SYL_C);
      n = n[0].toUpperCase() + n.slice(1);
      if (!used.has(n)) { used.add(n); return n; }
    }
  };
}

function scatter(rng, count, meanSpacing) {
  const pts = [[0, 0]]; // 原点 = 太陽系
  const dmin = 0.45 * Math.sqrt(Math.PI / count); // 単位円での最小間隔
  for (let tries = 0; pts.length < count && tries < count * 500; tries++) {
    const r = Math.sqrt(rng.next());
    const th = rng.range(0, Math.PI * 2);
    const x = r * Math.cos(th);
    const y = r * Math.sin(th);
    if (pts.every((p) => (p[0] - x) ** 2 + (p[1] - y) ** 2 >= dmin * dmin)) pts.push([x, y]);
  }
  const k = meanSpacing / meanNearest(pts);
  return pts.map(([x, y]) => [x * k, y * k]);
}

function nearestDistances(pts) {
  return pts.map((p, i) => {
    let best = Infinity;
    pts.forEach((q, j) => {
      if (i !== j) best = Math.min(best, Math.hypot(p[0] - q[0], p[1] - q[1]));
    });
    return best;
  });
}
const meanNearest = (pts) => {
  const d = nearestDistances(pts);
  return d.reduce((s, v) => s + v, 0) / d.length;
};

function makeSystem(rng, id, x, y, name) {
  const primary = makePrimary(rng);
  const companions = makeCompanions(rng, primary);
  // 伴星が近いと、その 1/3 より内側の軌道しか安定しない
  const maxA = companions.length ? companions[0].sep / 3 : 100;
  const bodies = generatePlanets(rng, primary, name, maxA);
  const stars = [
    { id: 's0', name: `${name} A`, ...primary, sep: 0, phase: 0 },
    ...companions.map((c, i) => ({
      id: `s${i + 1}`, name: `${name} ${'BC'[i]}`, ...c.star, sep: c.sep, phase: c.phase,
    })),
  ];
  if (stars.length === 1) stars[0].name = name;
  return { id, name, x, y, stars, bodies };
}

function generateGalaxy({ seed = 1, starCount = 400, meanSpacing = 4 } = {}) {
  const rng = new Rng(typeof seed === 'number' ? seed : hashSeed(seed));
  const pts = scatter(rng, starCount, meanSpacing);
  const namer = makeNamer(rng);
  const systems = pts.map(([x, y], i) => {
    if (i > 0) return makeSystem(rng, i, x, y, namer());
    const sol = makeSol();
    return { id: 0, name: sol.name, x, y, stars: [{ id: 's0', name: '太陽', ...sol.star, sep: 0, phase: 0 }], bodies: sol.bodies };
  });
  const radius = Math.max(...systems.map((s) => Math.hypot(s.x, s.y)));
  const galaxy = { seed, systems, radius, meanSpacing };
  addExtras(galaxy);
  return galaxy;
}

const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// 資源の埋蔵量と先住民の生成。銀河本体とは別の乱数列を使うので、既存のセーブと同じ銀河になる。

const RES = ['food', 'water', 'metal', 'fuel', 'rare', 'goods'];
const MINED = ['water', 'metal', 'fuel', 'rare'];
const RES_LABEL = { food: '食料', water: '水', metal: '金属', fuel: '燃料', rare: '希少元素', goods: '工業品', credits: 'cr' };
const PRICE = { food: 1, water: 0.8, metal: 1.5, fuel: 2, rare: 8, goods: 4 };
const TECH_LABEL = ['石器時代', '農耕時代', '産業時代', '情報時代'];
const KANA_A = ['カ', 'ヴェ', 'ロ', 'リ', 'サ', 'トゥ', 'ネ', 'ミ', 'ゾ', 'アル', 'エル', 'オル', 'ダ', 'フィ', 'ゼ', 'ユ', 'ハ', 'ボ', 'ギ', 'セ'];
const KANA_B = ['ラ', 'タ', 'ニス', 'ロン', 'ドール', 'リア', 'ソル', 'ヴェン', 'ムス', 'タン', 'リス', 'ガル', 'ファ', 'コン', 'ディス', 'リクス'];

// 埋蔵量は 0〜2.5 程度の係数。鉱業に就く 100万人あたりの年産量になる。
function makeDeposits(rng, b) {
  const d = { water: 0, metal: 0, fuel: 0, rare: 0 };
  const icy = b.surface === 'frozen';
  switch (b.type) {
    case 'rocky':
      d.metal = rng.range(0.4, 1.4);
      d.rare = rng.chance(0.3) ? rng.range(0.1, 0.6) : 0.02;
      d.water = 0.2 + 0.5 * clamp(b.water, 0, 1) + (icy ? 0.8 : 0);
      break;
    case 'dwarf':
      d.metal = rng.range(0.2, 0.8);
      d.rare = rng.chance(0.2) ? rng.range(0.1, 0.5) : 0;
      d.water = icy ? rng.range(0.8, 1.6) : 0.1;
      break;
    case 'belt': d.metal = rng.range(1.4, 2.4); d.rare = rng.range(0.3, 1); d.water = rng.range(0.1, 0.5); break;
    case 'gas-giant': d.fuel = rng.range(1.4, 2.4); break;
    case 'ice-giant': d.fuel = rng.range(0.7, 1.4); d.water = rng.range(1, 2); break;
    case 'mini-neptune': d.fuel = rng.range(0.4, 1); d.water = rng.range(0.4, 1); break;
    default: break;
  }
  return d;
}

// 先住民は大気と海のある温暖な惑星にだけいる。pop は人口[百万人]。mood は初期の友好度。
function makeNatives(rng, b) {
  const lush = b.surface === 'temperate' || b.surface === 'ocean';
  if (!lush || !b.settle || b.settle.grade < 2 || !rng.chance(b.settle.grade === 3 ? 0.55 : 0.3)) return null;
  const tech = rng.weighted([0, 1, 2, 3], (t) => [0.4, 0.35, 0.18, 0.07][t]);
  return {
    species: `${rng.pick(KANA_A)}${rng.pick(KANA_B)}人`,
    pop: rng.logUniform(1, 300) * (1 + tech) ** 1.5,
    tech,
    mood: Math.round(rng.range(-40, 30)),
  };
}

function addExtras(galaxy) {
  for (const sys of galaxy.systems) {
    const rng = new Rng(hashSeed(`${galaxy.seed}/extras/${sys.id}`));
    for (const b of sys.bodies) {
      b.deposits = makeDeposits(rng, b);
      b.natives = sys.id === 0 ? null : makeNatives(rng, b);
    }
    for (const s of sys.stars) s.deposits = { water: 0, metal: 0, fuel: 0, rare: 0 };
  }
  galaxy.systems[0].bodies.find((b) => b.id === 'earth').deposits = { water: 0.5, metal: 1, fuel: 0.4, rare: 0.15 };
}

// ゲーム状態: 時間、入植地、入植船、経済、交易、軍事、先住民。
// 人口の単位は百万人。資源の単位は「100万人が1年に食べる食料」= 1 を基準にした量。


const SHIP_SPEED = 1.0; // 船の速度 [ly/年] = 光速 (1c)
const START_YEAR = 2300;
const START_CREDITS = 1000;
const STEP = 0.25; // 経済シミュレーションの刻み[年]

const KIND_LABEL = { station: '宇宙ステーション', planet: '惑星入植地' };
const FOCUS = {
  balanced: { label: '自給', farm: 0.5, mine: 0.25, ind: 0.25 },
  farm: { label: '農業', farm: 0.8, mine: 0.1, ind: 0.1 },
  mine: { label: '鉱業', farm: 0.2, mine: 0.7, ind: 0.1 },
  ind: { label: '工業', farm: 0.2, mine: 0.1, ind: 0.7 },
};
const FACILITY = { farm: '農場', mine: '鉱山', factory: '工場', habitat: '居住区', shipyard: '造船所' };
const FACILITY_MAX = { farm: 10, mine: 10, factory: 10, habitat: 10, shipyard: 1 };
const SHIP_COST = { planet: { credits: 300, goods: 100, fuel: 100 }, station: { credits: 150, goods: 50, fuel: 50 } };
const SETTLERS = { planet: 0.2, station: 0.02 }; // 入植船が運ぶ人口[百万人]
const WARSHIP_COST = { credits: 150, metal: 100, fuel: 50, rare: 10 };
const WARSHIP_UPKEEP = 5; // cr/年
const GIFT_COST = { credits: 100 };
const PIRATE_START = 2320;
const LEDGER_LABEL = { tax: '税収', trade: '交易', export: '余剰の売却', natives: '先住民', upkeep: '軍の維持費' };

const zeroRes = () => Object.fromEntries(RES.map((r) => [r, 0]));
const colKey = (c) => `${c.sys}|${c.body}|${c.kind}`;
const relLabel = (r) => (r >= 60 ? '友好' : r >= 20 ? '好意的' : r >= -20 ? '中立' : r >= -60 ? '警戒' : '敵対');
const fail = (reason) => ({ ok: false, reason });

class Game {
  constructor(galaxy) {
    this.galaxy = galaxy;
    this.year = START_YEAR;
    this.colonies = [];
    this.ships = [];
    this.log = [];
    this.nextShipId = 1;
    this.credits = START_CREDITS;
    this.stock = {}; // 星系ごとの備蓄。同じ星系の入植地は備蓄を共有する
    this.routes = []; // 交易路 { id, a, b, lv, transit: [A→Bの輸送中量, B→A], vol: [年あたり輸送量] }
    this.cargo = []; // 輸送中の貨物 { route, dir, arrive, load }
    this.garrison = { 0: 3 }; // 星系ごとの駐留軍艦数
    this.fleets = []; // 移動中の艦隊 { id, from, to, n, depart, arrive }
    this.natives = {}; // 先住民の状態 { 'sys|body': { rel, status, pop } }
    this.infamy = 0; // 先住民を制圧するたびに増え、他の先住民の友好度を下げる
    this.surveyed = [];
    this.events = []; // 重要なイベント { id, year, kind, sys, text, good }
    this.projects = []; // 資材の搬入を待つ建設 { id, type, sys, start, ready, from: [搬出元の星系], label, ... }
    this.flow = {}; // 直近の星系ごとの生産・需要[年あたり] (保存しない)
    this.ledger = {}; // 直近の収支[cr/年] (保存しない)
    this.led = {}; // 今の刻みの収支
    this.addColony(0, 'earth', 'planet', '地球', 10000);
    Object.assign(this.colonies[0].lv, { mine: 1, factory: 2, shipyard: 1 });
    Object.assign(this.stock[0], { food: 5000, water: 1000, metal: 3000, fuel: 2000, rare: 300, goods: 2000 });
    this.message('ゲーム開始。地球から恒星間入植を進めよう。');
  }

  system(id) { return this.galaxy.systems[id]; }

  // 星系内の入植対象: 惑星・小惑星帯・恒星
  targetsOf(sys) { return [...sys.bodies, ...sys.stars]; }
  target(sysId, bodyId) { return this.targetsOf(this.system(sysId)).find((b) => b.id === bodyId); }

  coloniesIn(sysId) { return this.colonies.filter((c) => c.sys === sysId); }
  colonyAt(sysId, bodyId, kind) {
    return this.colonies.find((c) => c.sys === sysId && c.body === bodyId && c.kind === kind);
  }
  colonyByKey(key) { return this.colonies.find((c) => colKey(c) === key); }
  isColonized(sysId) { return this.colonies.some((c) => c.sys === sysId); }
  colonizedSystems() { return [...new Set(this.colonies.map((c) => c.sys))].map((i) => this.system(i)); }
  shipTo(sysId, bodyId, kind) {
    return this.ships.find((s) => s.to === sysId && s.body === bodyId && s.kind === kind);
  }
  stockOf(sysId) {
    if (!this.stock[sysId]) this.stock[sysId] = zeroRes();
    return this.stock[sysId];
  }
  totalPop() { return this.colonies.reduce((s, c) => s + c.pop, 0); }
  warships() { return Object.values(this.garrison).reduce((s, n) => s + n, 0) + this.fleets.reduce((s, f) => s + f.n, 0); }
  income() { return Object.values(this.ledger).reduce((s, v) => s + v, 0); }

  // --- 調査と先住民 ---
  isSurveyed(sysId) { return this.surveyed.includes(sysId); }
  survey(sysId) {
    if (this.isSurveyed(sysId)) return;
    this.surveyed.push(sysId);
    for (const b of this.system(sysId).bodies) {
      if (b.natives) this.event('natives', sysId, `${b.name} で先住民「${b.natives.species}」(${TECH_LABEL[b.natives.tech]}) を発見した`);
    }
  }
  nativeOf(sysId, bodyId) {
    const def = this.target(sysId, bodyId)?.natives;
    if (!def) return null;
    const key = `${sysId}|${bodyId}`;
    if (!this.natives[key]) this.natives[key] = { rel: def.mood - this.infamy, status: 'independent', pop: def.pop };
    return { def, st: this.natives[key] };
  }
  // 制圧に必要な戦力(軍艦の隻数)
  nativeDefense(n) { return Math.max(1, Math.ceil((n.def.tech + 1) ** 2 * Math.log10(1 + n.st.pop))); }

  // --- 入植地 ---
  capOf(c) {
    if (c.sys === 0 && c.body === 'earth' && c.kind === 'planet') return 12000 * (1 + 0.25 * c.lv.habitat);
    if (c.kind === 'station') return 2 * (1 + c.lv.habitat);
    const grade = this.target(c.sys, c.body).settle?.grade || 1;
    return [80, 80, 800, 4000][grade] * (1 + 0.5 * c.lv.habitat);
  }
  surfaceOf(c) { return c.kind === 'planet' ? this.target(c.sys, c.body).surface : null; }
  fertility(c) { return { temperate: 1, ocean: 0.6 }[this.surfaceOf(c)] || 0; }
  needsWater(c) { return !this.fertility(c); } // 温暖・海洋の惑星以外は水を消費する

  // 入植可否と理由。惑星入植は適性≥1の固体天体のみ、ステーションは任意の天体の周回軌道に建設できる。
  check(sysId, bodyId, kind) {
    const t = this.target(sysId, bodyId);
    if (!t) return fail('対象が存在しない');
    if (this.colonyAt(sysId, bodyId, kind)) return fail('建設済み');
    if (this.shipTo(sysId, bodyId, kind)) return fail('入植船が向かっている');
    if (this.projects.some((j) => j.type === 'ship' && j.to === sysId && j.body === bodyId && j.kind === kind)) return fail('入植船を準備中');
    if (kind === 'planet' && !(t.settle && t.settle.grade >= 1)) {
      return fail(t.settle ? t.settle.notes.join('、') || '入植に適さない' : '惑星ではない');
    }
    if (kind === 'planet' && this.isSurveyed(sysId) && this.blockedByNatives(sysId, bodyId)) {
      return fail('先住民の同意が必要 (友好度40以上)');
    }
    return { ok: true, reason: '' };
  }
  blockedByNatives(sysId, bodyId) {
    const n = this.nativeOf(sysId, bodyId);
    return !!n && n.st.status === 'independent' && n.st.rel < 40;
  }

  // 支払い。資源は指定星系の備蓄から払う。
  lack(cost, sysId) {
    if ((cost.credits || 0) > this.credits) return 'クレジット不足';
    const st = sysId === undefined ? null : this.stockOf(sysId);
    for (const r of RES) {
      if (cost[r] && (!st || st[r] < cost[r])) return `${RES_LABEL[r]}が不足 (${Math.floor(st ? st[r] : 0)}/${cost[r]})`;
    }
    return '';
  }
  pay(cost, sysId) {
    const why = this.lack(cost, sysId);
    if (why) return fail(why);
    this.credits -= cost.credits || 0;
    for (const r of RES) if (cost[r]) this.stockOf(sysId)[r] -= cost[r];
    return { ok: true };
  }

  // 建設資材の調達計画。地元の備蓄で足りない分は、近い入植星系から順に取り寄せる。
  // 取り寄せ元には1年分の需要を残す。eta は最も遠い取り寄せ元からの搬入年数 (0 なら即時)。
  procure(cost, sysId) {
    if ((cost.credits || 0) > this.credits) return { why: 'クレジット不足' };
    const plan = [];
    let eta = 0;
    for (const r of RES) {
      let need = cost[r] || 0;
      if (!need) continue;
      if (sysId === undefined) return { why: `${RES_LABEL[r]}が不足` };
      const local = Math.min(Math.max(this.stockOf(sysId)[r], 0), need);
      if (local > 0) { plan.push({ from: sysId, r, amt: local }); need -= local; }
      if (need <= 1e-9) continue;
      const sources = this.colonizedSystems()
        .filter((s) => s.id !== sysId)
        .map((s) => ({ id: s.id, d: this.travelYears(s.id, sysId), spare: this.stockOf(s.id)[r] - (this.flow[s.id]?.cons[r] || 0) }))
        .filter((x) => x.spare > 0)
        .sort((a, b) => a.d - b.d);
      for (const x of sources) {
        const amt = Math.min(x.spare, need);
        plan.push({ from: x.id, r, amt });
        need -= amt;
        eta = Math.max(eta, x.d);
        if (need <= 1e-9) break;
      }
      if (need > 1e-6) return { why: `帝国全体で${RES_LABEL[r]}が不足` };
    }
    return { why: '', eta, plan };
  }
  // 建設を発注する。費用はその場で払い、資材が届いた時点で完成する。
  order(cost, sysId, job) {
    const p = this.procure(cost, sysId);
    if (p.why) return fail(p.why);
    this.credits -= cost.credits || 0;
    for (const x of p.plan) this.stockOf(x.from)[x.r] -= x.amt;
    if (p.eta <= 0) { this.finish({ ...job, sys: sysId }); return { ok: true }; }
    Object.assign(job, {
      id: this.nextShipId++, sys: sysId, start: this.year, ready: this.year + p.eta,
      from: [...new Set(p.plan.filter((x) => x.from !== sysId).map((x) => x.from))],
    });
    this.projects.push(job);
    this.message(`${job.label}: 資材を周辺の星系から搬入中 (完成まで ${p.eta.toFixed(1)} 年)`);
    return { ok: true };
  }
  pending(pred) { return this.projects.find(pred); }
  finish(job) {
    if (job.type === 'upgrade') {
      const c = this.colonyByKey(job.col);
      if (!c) return;
      c.lv[job.fac]++;
      this.message(`${c.name} の${FACILITY[job.fac]}を Lv${c.lv[job.fac]} に拡張した`);
    } else if (job.type === 'warship') {
      this.garrison[job.sys] = (this.garrison[job.sys] || 0) + 1;
      this.message(`${this.system(job.sys).name} で軍艦を建造した (駐留 ${this.garrison[job.sys]} 隻)`);
    } else if (job.type === 'route') {
      const r = this.routes.find((x) => x.id === job.route);
      if (!r) return;
      r.lv++;
      this.message(`${this.system(r.a).name} ⇄ ${this.system(r.b).name} の交易路を Lv${r.lv} に拡張した`);
    } else if (job.type === 'ship') {
      this.launch(job.sys, job.to, job.body, job.kind);
    }
  }

  travelYears(fromId, toId) {
    return Math.max(distance(this.system(fromId), this.system(toId)), 0.001) / SHIP_SPEED;
  }

  dispatch(fromId, toId, bodyId, kind) {
    const c = this.check(toId, bodyId, kind);
    if (!c.ok) return c;
    if (!this.isColonized(fromId)) return fail('出発地に入植地がない');
    const label = `${this.target(toId, bodyId).name} への入植船 (${KIND_LABEL[kind]})`;
    return this.order(SHIP_COST[kind], fromId, { type: 'ship', to: toId, body: bodyId, kind, label });
  }
  launch(fromId, toId, bodyId, kind) {
    const years = this.travelYears(fromId, toId);
    const ship = {
      id: this.nextShipId++, from: fromId, to: toId, body: bodyId, kind,
      depart: this.year, arrive: this.year + years,
    };
    this.ships.push(ship);
    this.message(`${this.system(fromId).name} → ${this.system(toId).name} へ入植船が出発 (${KIND_LABEL[kind]}、到着まで ${years.toFixed(2)} 年)`);
    return { ok: true, ship };
  }

  addColony(sysId, bodyId, kind, name, pop = SETTLERS[kind]) {
    this.colonies.push({
      sys: sysId, body: bodyId, kind, founded: this.year, name, pop, focus: 'balanced',
      lv: { farm: 0, mine: 0, factory: 0, habitat: 0, shipyard: 0 },
    });
    this.stockOf(sysId);
    this.survey(sysId);
  }

  upgradeCost(c, fac) {
    const k = 2 ** c.lv[fac];
    return { credits: Math.round((100 + 0.05 * c.pop) * k), metal: Math.round(50 * k) };
  }
  upgrade(c, fac) {
    if (c.lv[fac] >= FACILITY_MAX[fac]) return fail('最大レベル');
    const col = colKey(c);
    if (this.pending((j) => j.type === 'upgrade' && j.col === col && j.fac === fac)) return fail('建設中');
    return this.order(this.upgradeCost(c, fac), c.sys, { type: 'upgrade', col, fac, label: `${c.name} の${FACILITY[fac]} Lv${c.lv[fac] + 1}` });
  }

  // --- 交易路 ---
  routeBetween(a, b) { return this.routes.find((r) => (r.a === a && r.b === b) || (r.a === b && r.b === a)); }
  routeCap(r) { return 200 * r.lv; } // 片道あたりの輸送量[単位/年]
  routeCost(a, b) { return { credits: Math.round(100 + 10 * distance(this.system(a), this.system(b))) }; }
  routeUpCost(r) { return { credits: 150 * r.lv, metal: 50 * r.lv }; }
  openRoute(a, b) {
    if (a === b || !this.isColonized(a) || !this.isColonized(b)) return fail('両端に入植地が必要');
    if (this.routeBetween(a, b)) return fail('開設済み');
    const paid = this.pay(this.routeCost(a, b));
    if (!paid.ok) return paid;
    this.routes.push({ id: this.nextShipId++, a, b, lv: 1, transit: [zeroRes(), zeroRes()], vol: [0, 0] });
    this.message(`${this.system(a).name} ⇄ ${this.system(b).name} の交易路を開設した`);
    return { ok: true };
  }
  upgradeRoute(r) {
    if (this.pending((j) => j.type === 'route' && j.route === r.id)) return fail('拡張中');
    return this.order(this.routeUpCost(r), r.a, { type: 'route', route: r.id, label: `${this.system(r.a).name} ⇄ ${this.system(r.b).name} の交易路 Lv${r.lv + 1}` });
  }

  // 各交易路は、送り手の余剰(需要2年分を超える備蓄)を受け手の不足(需要2年分に満たない分)へ自動で運ぶ。
  trade(h, flow) {
    for (const r of this.routes) {
      const years = this.travelYears(r.a, r.b);
      for (const dir of [0, 1]) {
        const [from, to] = dir ? [r.b, r.a] : [r.a, r.b];
        const sf = this.stockOf(from);
        const sto = this.stockOf(to);
        const transit = r.transit[dir];
        let room = this.routeCap(r) * h;
        let sent = 0;
        for (const res of RES) {
          if (room <= 0) break;
          const spare = sf[res] - 2 * (flow[from]?.cons[res] || 0);
          const want = 2 * (flow[to]?.cons[res] || 0) - sto[res] - transit[res];
          const amt = Math.min(spare, want, room);
          if (amt <= 0.001) continue;
          sf[res] -= amt;
          transit[res] += amt;
          room -= amt;
          sent += amt;
          let p = this.cargo[this.cargo.length - 1];
          if (!(p && p.route === r.id && p.dir === dir && this.year + years - p.arrive < 0.5)) {
            p = { route: r.id, dir, arrive: this.year + years, load: {} };
            this.cargo.push(p);
          }
          p.load[res] = (p.load[res] || 0) + amt;
        }
        r.vol[dir] += (sent / h - r.vol[dir]) * Math.min(1, h);
      }
    }
  }

  // --- 軍事 ---
  hasShipyard(sysId) { return this.coloniesIn(sysId).some((c) => c.lv.shipyard >= 1); }
  buildWarship(sysId) {
    if (!this.hasShipyard(sysId)) return fail('造船所がない');
    return this.order(WARSHIP_COST, sysId, { type: 'warship', label: `${this.system(sysId).name} の軍艦` });
  }
  sendFleet(from, to, n) {
    const have = this.garrison[from] || 0;
    n = Math.min(n, have);
    if (from === to || n < 1) return fail('派遣できる軍艦がない');
    this.garrison[from] = have - n;
    const years = this.travelYears(from, to);
    this.fleets.push({ id: this.nextShipId++, from, to, n, depart: this.year, arrive: this.year + years });
    this.message(`${this.system(from).name} → ${this.system(to).name} へ艦隊 ${n} 隻が出撃 (到着まで ${years.toFixed(2)} 年)`);
    return { ok: true };
  }

  // 他の星系に駐留する全艦をこの星系へ集める
  rally(to) {
    const from = Object.keys(this.garrison).map(Number).filter((id) => id !== to && this.garrison[id] > 0);
    if (!from.length) return fail('集められる軍艦がない');
    for (const id of from) this.sendFleet(id, to, this.garrison[id]);
    return { ok: true };
  }
  setFocusAll(focus) {
    if (!FOCUS[focus]) return fail('方針が不正');
    for (const c of this.colonies) c.focus = focus;
    this.message(`全入植地の方針を「${FOCUS[focus].label}」にした`);
    return { ok: true };
  }

  // 宇宙海賊の襲撃。入植地が増えるほど、時代が進むほど増える。地球は本国艦隊が守っている前提で対象外。
  pirates(h) {
    if (this.year < PIRATE_START) return false;
    const targets = this.colonizedSystems().filter((s) => s.id !== 0);
    if (!targets.length || Math.random() > 0.05 * Math.sqrt(targets.length) * h) return false;
    const sys = targets[Math.floor(Math.random() * targets.length)];
    const power = Math.max(1, Math.round((1 + (this.year - PIRATE_START) / 40) * (0.5 + Math.random())));
    const g = this.garrison[sys.id] || 0;
    if (g >= power) {
      const loss = Math.floor((power / 3) * Math.random());
      this.garrison[sys.id] = g - loss;
      this.event('pirate', sys.id, `${sys.name} で宇宙海賊 (戦力${power}) を撃退した${loss ? ` (軍艦 ${loss} 隻を喪失)` : ''}`, true);
    } else {
      this.garrison[sys.id] = 0;
      const st = this.stockOf(sys.id);
      for (const r of RES) st[r] *= 0.6;
      for (const c of this.coloniesIn(sys.id)) c.pop *= 0.9;
      this.event('pirate', sys.id, `${sys.name} が宇宙海賊 (戦力${power}) に略奪された${g ? ` (駐留艦 ${g} 隻は全滅)` : ''}`);
    }
    return true;
  }

  // --- 先住民との関係 ---
  gift(sysId, bodyId) {
    const n = this.nativeOf(sysId, bodyId);
    if (!n || n.st.status !== 'independent') return fail('対象がいない');
    if (!this.isColonized(sysId)) return fail('この星系に拠点が必要');
    const paid = this.pay(GIFT_COST);
    if (!paid.ok) return paid;
    n.st.rel = Math.min(100, n.st.rel + 10);
    this.message(`${n.def.species}に贈り物をした (友好度 ${Math.round(n.st.rel)})`);
    return { ok: true };
  }
  integrate(sysId, bodyId) {
    const n = this.nativeOf(sysId, bodyId);
    const c = this.colonyAt(sysId, bodyId, 'planet');
    if (!n || n.st.status !== 'independent') return fail('対象がいない');
    if (!c) return fail('同じ惑星に入植地が必要');
    if (n.st.rel < 80) return fail('友好度80以上が必要');
    c.pop += n.st.pop;
    n.st.status = 'integrated';
    this.event('natives', sysId, `${n.def.species} ${fmtPop(n.st.pop)}が ${c.name} の市民になった`, true);
    return { ok: true };
  }
  conquer(sysId, bodyId) {
    const n = this.nativeOf(sysId, bodyId);
    if (!n || n.st.status !== 'independent') return fail('対象がいない');
    const need = this.nativeDefense(n);
    const g = this.garrison[sysId] || 0;
    if (g < need) return fail(`戦力不足 (軍艦 ${need} 隻以上が必要)`);
    const loss = Math.ceil(need / 3);
    this.garrison[sysId] = g - loss;
    n.st.status = 'subjugated';
    n.st.pop *= 0.7;
    n.st.rel = -80;
    this.infamy += 25;
    for (const st of Object.values(this.natives)) if (st !== n.st && st.status === 'independent') st.rel -= 25;
    this.event('natives', sysId, `${n.def.species}を制圧した (軍艦 ${loss} 隻を喪失)。他の先住民の友好度が下がった`);
    return { ok: true };
  }

  // --- 時間の進行 ---
  advance(dt) {
    let changed = false;
    while (dt > 1e-9) {
      const h = Math.min(STEP, dt);
      dt -= h;
      this.year += h;
      this.led = {};
      if (this.arrivals()) changed = true;
      this.economy(h);
      if (this.pirates(h)) changed = true;
    }
    return changed;
  }

  arrivals() {
    let changed = false;
    const done = this.projects.filter((j) => j.ready <= this.year);
    if (done.length) {
      changed = true;
      this.projects = this.projects.filter((j) => j.ready > this.year);
      for (const j of done) this.finish(j);
    }
    const arrived = this.ships.filter((s) => s.arrive <= this.year);
    if (arrived.length) {
      changed = true;
      this.ships = this.ships.filter((s) => s.arrive > this.year);
      for (const s of arrived) {
        const t = this.target(s.to, s.body);
        this.survey(s.to);
        let kind = s.kind;
        if (kind === 'planet' && this.blockedByNatives(s.to, s.body)) {
          this.message(`${t.name} の先住民に着陸を拒まれた。入植団は軌道上にとどまる`);
          kind = 'station';
        }
        if (this.colonyAt(s.to, s.body, kind)) continue;
        this.addColony(s.to, s.body, kind, t.name);
        this.event('colony', s.to, `${t.name} に${KIND_LABEL[kind]}を設立した (${this.system(s.to).name})`, true);
      }
    }
    const fleets = this.fleets.filter((f) => f.arrive <= this.year);
    if (fleets.length) {
      changed = true;
      this.fleets = this.fleets.filter((f) => f.arrive > this.year);
      for (const f of fleets) {
        this.garrison[f.to] = (this.garrison[f.to] || 0) + f.n;
        this.message(`艦隊 ${f.n} 隻が ${this.system(f.to).name} に到着した`);
        this.survey(f.to);
      }
    }
    if (this.cargo.length && this.cargo[0].arrive <= this.year) {
      const due = this.cargo.filter((p) => p.arrive <= this.year);
      this.cargo = this.cargo.filter((p) => p.arrive > this.year);
      for (const p of due) {
        const r = this.routes.find((x) => x.id === p.route);
        if (!r) continue;
        const st = this.stockOf(p.dir ? r.a : r.b);
        for (const [res, amt] of Object.entries(p.load)) {
          st[res] += amt;
          r.transit[p.dir][res] = Math.max(0, r.transit[p.dir][res] - amt);
          this.earn('trade', amt * PRICE[res] * 0.1); // 運んだ荷の価値の1割が交易収入になる
        }
      }
    }
    return changed;
  }

  earn(kind, amount) {
    this.credits += amount;
    this.led[kind] = (this.led[kind] || 0) + amount;
  }

  economy(h) {
    const flow = {};
    const F = (s) => (flow[s] ??= { prod: zeroRes(), cons: zeroRes(), pop: 0 });

    // 1. 生産: 人口を方針の比率で農業・鉱業・工業に振り分ける。施設レベル1ごとに +25%
    for (const c of this.colonies) {
      const b = this.target(c.sys, c.body);
      const f = FOCUS[c.focus] || FOCUS.balanced;
      const st = this.stockOf(c.sys);
      const fl = F(c.sys);
      const add = (r, v) => { st[r] += v * h; fl.prod[r] += v; };
      add('food', c.pop * f.farm * (2 + 2 * this.fertility(c)) * (1 + 0.25 * c.lv.farm));
      for (const r of MINED) add(r, c.pop * f.mine * (b.deposits?.[r] || 0) * (1 + 0.25 * c.lv.mine));
      c.plan = c.pop * f.ind * (1 + 0.25 * c.lv.factory);
      fl.pop += c.pop;
    }
    // 2. 工業: 工業品1につき金属0.5と燃料0.2を使う。原料が足りなければ減産
    for (const c of this.colonies) {
      const st = this.stockOf(c.sys);
      const fl = F(c.sys);
      const need = c.plan * h;
      const k = need > 0 ? clamp(Math.min(st.metal / (0.5 * need), st.fuel / (0.2 * need)), 0, 1) : 0;
      st.metal -= 0.5 * need * k;
      st.fuel -= 0.2 * need * k;
      st.goods += need * k;
      fl.cons.metal += 0.5 * c.plan;
      fl.cons.fuel += 0.2 * c.plan;
      fl.prod.goods += c.plan * k;
      c.industry = k;
      if (c.pop >= 1 && c.plan > 0) {
        this.watch(c, 'industry', k, 'shortage', () => `${c.name} の工場が原料 (金属・燃料) 不足で減産 (稼働 ${pct(k)})`, `${c.name} の工場の原料不足が解消した`);
      }
    }
    // 3. 消費と人口の増減、税収
    for (const c of this.colonies) {
      const st = this.stockOf(c.sys);
      const fl = F(c.sys);
      const use = (r, v) => {
        fl.cons[r] += v;
        const want = v * h;
        const got = Math.min(Math.max(st[r], 0), want);
        st[r] -= got;
        return want > 0 ? got / want : 1;
      };
      const food = use('food', c.pop);
      const water = this.needsWater(c) ? use('water', 0.1 * c.pop) : 1;
      const goods = use('goods', 0.3 * c.pop);
      c.sat = { food, water, goods };
      this.watch(c, 'food', food, 'famine', () => `${c.name} で飢餓が発生 (食料の充足率 ${pct(food)})`, `${c.name} の飢餓が解消した`);
      if (this.needsWater(c)) this.watch(c, 'water', water, 'famine', () => `${c.name} で水不足が発生 (充足率 ${pct(water)})`, `${c.name} の水不足が解消した`);
      if (c.pop >= 1) this.watch(c, 'goods', goods, 'shortage', () => `${c.name} で工業品が不足 (充足率 ${pct(goods)})`, `${c.name} の工業品不足が解消した`);
      const life = Math.min(food, water);
      const n = c.kind === 'planet' ? this.nativeOf(c.sys, c.body) : null;
      const unrest = n && n.st.status !== 'integrated' && n.st.rel < -20 ? 0.02 : 0;
      c.growth = 0.05 * (1 - c.pop / this.capOf(c)) * life * (0.5 + 0.5 * goods) - 0.05 * (1 - life) - unrest;
      c.pop = Math.max(0.001, c.pop * (1 + c.growth * h));
      this.earn('tax', 0.05 * c.pop * (0.5 + 0.5 * goods) * h);
    }
    // 4. 先住民: 拠点がある星系では友好度が少しずつ上がる。友好的なら交易、制圧していれば貢納
    for (const [key, st] of Object.entries(this.natives)) {
      const sys = Number(key.split('|')[0]);
      if (!this.isColonized(sys)) continue;
      if (st.status === 'independent') {
        st.rel = Math.min(100, st.rel + 3 * h);
        if (st.rel >= 40) {
          this.earn('natives', 0.02 * st.pop * h);
          this.stockOf(sys).rare += 0.005 * st.pop * h;
        }
      } else if (st.status === 'subjugated') {
        this.earn('natives', 0.03 * st.pop * h);
      }
    }
    // 5. 交易路
    this.trade(h, flow);
    // 6. 備蓄の上限を超えた分は域外へ安値(基準価格の5%)で売る
    for (const [s, st] of Object.entries(this.stock)) {
      const cap = 500 + 5 * (flow[s]?.pop || 0);
      for (const r of RES) {
        if (st[r] > cap) {
          this.earn('export', (st[r] - cap) * PRICE[r] * 0.05);
          st[r] = cap;
        }
      }
    }
    // 7. 軍の維持費
    this.earn('upkeep', -WARSHIP_UPKEEP * this.warships() * h);

    this.flow = flow;
    const a = Math.min(1, h);
    for (const k of Object.keys(LEDGER_LABEL)) {
      const now = (this.led[k] || 0) / h;
      this.ledger[k] = this.ledger[k] === undefined ? now : this.ledger[k] + (now - this.ledger[k]) * a;
    }
  }

  // セーブデータの復元。壊れたデータなら false を返す。古い形式(人口や経済がない)は既定値で補う。
  restore(d) {
    const ok = (sysId, bodyId) => this.galaxy.systems[sysId] && this.target(sysId, bodyId);
    const obj = (v) => (v && typeof v === 'object' && !Array.isArray(v) ? v : null);
    if (!Array.isArray(d.colonies) || !Array.isArray(d.ships) || !Number.isFinite(d.year)) return false;
    if (!d.colonies.every((c) => ok(c.sys, c.body)) || !d.ships.every((s) => ok(s.to, s.body) && this.galaxy.systems[s.from])) return false;
    this.year = d.year;
    this.colonies = d.colonies;
    this.ships = d.ships;
    this.log = Array.isArray(d.log) ? d.log : [];
    this.nextShipId = d.nextShipId || 1;
    for (const c of this.colonies) {
      const earth = c.sys === 0 && c.body === 'earth' && c.kind === 'planet';
      if (!Number.isFinite(c.pop)) c.pop = earth ? 10000 : SETTLERS[c.kind];
      if (!FOCUS[c.focus]) c.focus = 'balanced';
      if (!obj(c.lv)) c.lv = earth ? { mine: 1, factory: 2, shipyard: 1 } : {};
      c.lv = { farm: 0, mine: 0, factory: 0, habitat: 0, shipyard: 0, ...c.lv };
    }
    if (Number.isFinite(d.credits)) this.credits = d.credits;
    if (obj(d.stock)) this.stock = { ...this.stock, ...d.stock };
    for (const st of Object.values(this.stock)) for (const r of RES) if (!Number.isFinite(st[r])) st[r] = 0;
    for (const c of this.colonies) this.stockOf(c.sys);
    const sysOk = (id) => !!this.galaxy.systems[id];
    if (Array.isArray(d.routes)) this.routes = d.routes.filter((r) => sysOk(r.a) && sysOk(r.b) && Array.isArray(r.transit));
    if (Array.isArray(d.cargo)) this.cargo = d.cargo.filter((p) => this.routes.some((r) => r.id === p.route));
    if (obj(d.garrison)) this.garrison = d.garrison;
    if (Array.isArray(d.fleets)) this.fleets = d.fleets.filter((f) => sysOk(f.from) && sysOk(f.to));
    if (Array.isArray(d.events)) this.events = d.events.filter((e) => e && typeof e.text === 'string');
    if (Array.isArray(d.projects)) this.projects = d.projects.filter((j) => j && sysOk(j.sys) && Number.isFinite(j.ready) && Array.isArray(j.from));
    if (obj(d.natives)) this.natives = d.natives;
    if (Number.isFinite(d.infamy)) this.infamy = d.infamy;
    this.surveyed = Array.isArray(d.surveyed) ? d.surveyed.filter(sysOk) : [];
    for (const c of this.colonies) if (!this.isSurveyed(c.sys)) this.surveyed.push(c.sys);
    return true;
  }

  // 重要なイベント。ログにも流す
  event(kind, sys, text, good = false) {
    this.events.unshift({ id: this.nextShipId++, year: this.year, kind, sys, text, good });
    this.events.length = Math.min(this.events.length, 200);
    this.message(text);
  }
  // 充足率などの悪化と回復を検知してイベントにする (ばたつかないよう 95% 未満で発生、99% 以上で解消)
  watch(c, key, v, kind, onText, offText) {
    if (!c.alerts) c.alerts = {};
    if (!c.alerts[key] && v < 0.95) {
      c.alerts[key] = true;
      this.event(kind, c.sys, onText());
    } else if (c.alerts[key] && v >= 0.99) {
      c.alerts[key] = false;
      this.event(kind, c.sys, offText, true);
    }
  }

  message(text) {
    this.log.unshift({ year: this.year, text });
    this.log.length = Math.min(this.log.length, 30);
  }

  // 船・艦隊の現在位置 (from→to を直線で移動)
  shipPosition(s) {
    const a = this.system(s.from);
    const b = this.system(s.to);
    const f = Math.min(1, (this.year - s.depart) / (s.arrive - s.depart));
    return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f, f };
  }
}

const TYPE_LABEL = {
  rocky: '岩石惑星', 'mini-neptune': 'ミニ・ネプチューン', 'gas-giant': 'ガス巨星', 'ice-giant': '氷巨星',
  dwarf: '矮小天体', belt: '小惑星帯',
};
const SURFACE_LABEL = {
  molten: '溶岩の海', scorched: '灼熱の乾燥地表', frozen: '氷に閉ざされた地表', temperate: '温暖(陸と海)',
  ocean: '海洋が広がる', desert: '乾燥した荒地', barren: '大気のない岩盤',
};
const BODY_COLOR = {
  molten: '#ff5a1f', scorched: '#c27a3a', frozen: '#cfe8f3', temperate: '#4d9a5b', ocean: '#3b82c4',
  desert: '#c9a063', barren: '#9a9a9a',
};
const TYPE_COLOR = {
  'mini-neptune': '#8fb0d9', 'gas-giant': '#d8b07a', 'ice-giant': '#6fb5d6', dwarf: '#8d8d96', belt: '#777',
};
const bodyColor = (b) => (b.surface && BODY_COLOR[b.surface]) || TYPE_COLOR[b.type] || '#aaa';
const GRADE_LABEL = ['不可', '困難', '可', '良好(地球型)'];
const fmt = (v, d = 2) => (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(d));

// 星間マップ: パン(ドラッグ)・ズーム(ホイール)・星の選択/ダブルクリックで星系を開く。



class GalaxyView {
  constructor(canvas, app) {
    this.canvas = canvas;
    this.app = app;
    this.ctx = canvas.getContext('2d');
    this.cam = { x: 0, y: 0, zoom: 6 };
    this.hover = null;
    this.drag = null;
    this.bind();
  }

  fit() {
    const r = this.app.game.galaxy.radius + 6;
    this.cam.zoom = clamp(Math.min(this.w, this.h) / 2 / r, 1.5, 80);
    this.cam.x = 0;
    this.cam.y = 0;
  }

  toScreen(x, y) {
    return [(x - this.cam.x) * this.cam.zoom + this.w / 2, (y - this.cam.y) * this.cam.zoom + this.h / 2];
  }
  toWorld(sx, sy) {
    return [(sx - this.w / 2) / this.cam.zoom + this.cam.x, (sy - this.h / 2) / this.cam.zoom + this.cam.y];
  }

  pick(sx, sy) {
    let best = null;
    let bd = 12;
    for (const s of this.app.game.galaxy.systems) {
      const [px, py] = this.toScreen(s.x, s.y);
      const d = Math.hypot(px - sx, py - sy);
      if (d < bd) { bd = d; best = s; }
    }
    return best;
  }

  zoomAt(factor, sx, sy) {
    const [wx, wy] = this.toWorld(sx, sy);
    this.cam.zoom = clamp(this.cam.zoom * factor, 1.5, 80);
    this.cam.x = wx - (sx - this.w / 2) / this.cam.zoom;
    this.cam.y = wy - (sy - this.h / 2) / this.cam.zoom;
  }

  // マウス・タッチ共通 (Pointer Events)。1本指=ドラッグ/タップ、2本指=ピンチズーム。
  bind() {
    const c = this.canvas;
    const pos = (e) => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    const pts = new Map();
    let pinch = null;
    c.addEventListener('pointerdown', (e) => {
      if (this.app.view !== 'galaxy') return;
      pts.set(e.pointerId, pos(e));
      c.setPointerCapture(e.pointerId);
      if (pts.size === 1) {
        const [x, y] = pos(e);
        this.drag = { x, y, cx: this.cam.x, cy: this.cam.y, moved: false };
      } else if (pts.size === 2) {
        const [a, b] = [...pts.values()];
        pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), zoom: this.cam.zoom };
        if (this.drag) this.drag.moved = true;
      }
    });
    c.addEventListener('pointermove', (e) => {
      if (this.app.view !== 'galaxy') return;
      const [x, y] = pos(e);
      if (pts.has(e.pointerId)) pts.set(e.pointerId, [x, y]);
      if (pinch && pts.size === 2) {
        const [a, b] = [...pts.values()];
        const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
        this.zoomAt((pinch.zoom * d / pinch.d) / this.cam.zoom, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
        return;
      }
      if (this.drag) {
        const dx = x - this.drag.x;
        const dy = y - this.drag.y;
        if (Math.hypot(dx, dy) > 6) this.drag.moved = true;
        if (this.drag.moved) {
          this.cam.x = this.drag.cx - dx / this.cam.zoom;
          this.cam.y = this.drag.cy - dy / this.cam.zoom;
        }
      }
      if (e.pointerType === 'mouse') {
        this.hover = this.pick(x, y);
        this.mouse = [x, y];
        c.style.cursor = this.hover ? 'pointer' : this.drag?.moved ? 'grabbing' : 'default';
      }
    });
    const end = (e) => {
      if (this.app.view !== 'galaxy') return;
      const [x, y] = pos(e);
      const wasPinch = pts.size > 1;
      pts.delete(e.pointerId);
      if (pts.size < 2) pinch = null;
      if (this.drag && !this.drag.moved && !wasPinch && e.type === 'pointerup') {
        const s = this.pick(x, y);
        if (s) this.app.selectSystem(s.id);
      }
      if (pts.size === 0) this.drag = null;
    };
    c.addEventListener('pointerup', end);
    c.addEventListener('pointercancel', end);
    c.addEventListener('dblclick', (e) => {
      if (this.app.view !== 'galaxy') return;
      const [x, y] = pos(e);
      const s = this.pick(x, y);
      if (s) this.app.openSystem(s.id);
    });
    c.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') this.hover = null; });
    c.addEventListener('wheel', (e) => {
      if (this.app.view !== 'galaxy') return;
      e.preventDefault();
      const [x, y] = pos(e);
      this.zoomAt(Math.exp(-e.deltaY * 0.0015), x, y);
    }, { passive: false });
  }

  centerOn(sys) { this.cam.x = sys.x; this.cam.y = sys.y; }

  draw(w, h) {
    this.w = w;
    this.h = h;
    const { ctx } = this;
    const game = this.app.game;
    const sel = game.system(this.app.sel.sys);
    const z = this.cam.zoom;

    // 選択中の星からの距離リング
    const [cx, cy] = this.toScreen(sel.x, sel.y);
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 6]);
    ctx.font = '11px sans-serif';
    ctx.fillStyle = 'rgba(120,160,230,0.55)';
    ctx.strokeStyle = 'rgba(90,130,210,0.25)';
    for (const d of [4, 8, 16, 32, 64]) {
      if (d * z < 20) continue;
      ctx.beginPath();
      ctx.arc(cx, cy, d * z, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillText(`${d} ly`, cx + 4, cy - d * z - 3);
    }
    ctx.setLineDash([]);

    // 交易路と輸送中の貨物
    ctx.lineWidth = 1.5;
    for (const r of game.routes) {
      const [ax, ay] = this.toScreen(game.system(r.a).x, game.system(r.a).y);
      const [bx, by] = this.toScreen(game.system(r.b).x, game.system(r.b).y);
      ctx.strokeStyle = 'rgba(111,220,150,0.35)';
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    }
    ctx.lineWidth = 1;
    ctx.fillStyle = '#6fdc96';
    for (const p of game.cargo) {
      const r = game.routes.find((x) => x.id === p.route);
      if (!r) continue;
      const [from, to] = p.dir ? [r.b, r.a] : [r.a, r.b];
      const pos = game.shipPosition({ from, to, depart: p.arrive - game.travelYears(from, to), arrive: p.arrive });
      const [px, py] = this.toScreen(pos.x, pos.y);
      ctx.fillRect(px - 1.5, py - 1.5, 3, 3);
    }

    // 艦隊
    for (const f of game.fleets) {
      const p = game.shipPosition(f);
      const [px, py] = this.toScreen(p.x, p.y);
      ctx.fillStyle = '#ff7a6b';
      ctx.beginPath(); ctx.moveTo(px, py - 5); ctx.lineTo(px + 4, py + 3); ctx.lineTo(px - 4, py + 3); ctx.fill();
    }

    // 建設資材の輸送船
    ctx.fillStyle = '#ffd24d';
    for (const j of game.projects) {
      for (const from of j.from) {
        const pos = game.shipPosition({ from, to: j.sys, depart: j.start, arrive: j.start + game.travelYears(from, j.sys) });
        const [px, py] = this.toScreen(pos.x, pos.y);
        ctx.beginPath(); ctx.moveTo(px, py - 3); ctx.lineTo(px + 3, py); ctx.lineTo(px, py + 3); ctx.lineTo(px - 3, py); ctx.fill();
      }
    }

    // 入植船
    for (const s of game.ships) {
      const a = game.system(s.from);
      const b = game.system(s.to);
      const [ax, ay] = this.toScreen(a.x, a.y);
      const [bx, by] = this.toScreen(b.x, b.y);
      const p = game.shipPosition(s);
      const [px, py] = this.toScreen(p.x, p.y);
      ctx.strokeStyle = 'rgba(255,170,60,0.45)';
      ctx.setLineDash([3, 4]);
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#ffb347';
      ctx.beginPath(); ctx.arc(px, py, 3.5, 0, Math.PI * 2); ctx.fill();
    }

    // 星
    const scale = clamp(z / 6, 0.8, 2.5);
    for (const s of game.galaxy.systems) {
      const [x, y] = this.toScreen(s.x, s.y);
      if (x < -20 || y < -20 || x > this.w + 20 || y > this.h + 20) continue;
      const star = s.stars[0];
      const r = (1.5 + 1.1 * Math.log10(1 + star.lum * 20)) * scale;
      const glow = ctx.createRadialGradient(x, y, 0, x, y, r * 3);
      glow.addColorStop(0, star.color);
      glow.addColorStop(0.35, star.color);
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(x, y, r * 3, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = star.color;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      if (s.stars.length > 1) {
        ctx.fillStyle = s.stars[1].color;
        ctx.beginPath(); ctx.arc(x + r * 1.1, y - r * 0.9, r * 0.5, 0, Math.PI * 2); ctx.fill();
      }
      if (game.isColonized(s.id)) {
        ctx.strokeStyle = '#4de3d0';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(x, y, r + 5, 0, Math.PI * 2); ctx.stroke();
      }
      const ships = game.garrison[s.id] || 0;
      if (ships) {
        ctx.fillStyle = '#ff7a6b';
        ctx.font = '10px sans-serif';
        ctx.fillText(`▲${ships}`, x - r - 8 - ctx.measureText(`▲${ships}`).width, y + 4);
      }
      if (game.isSurveyed(s.id) && s.bodies.some((b) => b.natives)) {
        ctx.fillStyle = '#c9a2ff';
        ctx.beginPath(); ctx.arc(x, y + r + 6, 2.5, 0, Math.PI * 2); ctx.fill();
      }
      if (s.id === this.app.sel.sys) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.strokeRect(x - r - 8, y - r - 8, (r + 8) * 2, (r + 8) * 2);
      }
      const labeled = z >= 10 || game.isColonized(s.id) || s.id === this.app.sel.sys || s === this.hover;
      if (labeled) {
        ctx.fillStyle = s === this.hover ? '#fff' : 'rgba(200,215,240,0.8)';
        ctx.font = '11px sans-serif';
        ctx.fillText(s.name, x + r + 7, y + 4);
      }
    }

    // ホバー中の星: 選択星からの距離と光速での所要年数
    if (this.hover && this.hover.id !== sel.id) {
      const d = distance(sel, this.hover);
      const t = game.travelYears(sel.id, this.hover.id);
      const [hx, hy] = this.toScreen(this.hover.x, this.hover.y);
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(hx, hy); ctx.stroke();
      const st = this.hover.stars[0];
      const lines = [this.hover.name, `${st.label}${this.hover.stars.length > 1 ? ` 他${this.hover.stars.length - 1}星` : ''}`,
        `距離 ${d.toFixed(1)} ly (${t.toFixed(1)} 年)`];
      const [mx, my] = this.mouse || [hx, hy];
      ctx.font = '12px sans-serif';
      const bw = Math.max(...lines.map((l) => ctx.measureText(l).width)) + 14;
      const bx = Math.min(mx + 14, this.w - bw - 4);
      const by = Math.min(my + 14, this.h - 60);
      ctx.fillStyle = 'rgba(10,14,24,0.9)';
      ctx.fillRect(bx, by, bw, 52);
      ctx.strokeStyle = '#345';
      ctx.strokeRect(bx, by, bw, 52);
      ctx.fillStyle = '#dfe8f7';
      lines.forEach((l, i) => ctx.fillText(l, bx + 7, by + 16 + i * 15));
    }
  }
}

// 星系マップ: 恒星・伴星・惑星・小惑星帯を軌道上に表示。軌道半径は対数スケール。




const A0 = 0.05; // 対数スケールの基準[AU]

class SystemView {
  constructor(canvas, app) {
    this.canvas = canvas;
    this.app = app;
    this.ctx = canvas.getContext('2d');
    this.hit = [];
    this.hover = null;
    canvas.addEventListener('pointermove', (e) => {
      if (app.view !== 'system') return;
      const r = canvas.getBoundingClientRect();
      this.hover = this.pick(e.clientX - r.left, e.clientY - r.top);
      canvas.style.cursor = this.hover ? 'pointer' : 'default';
    });
    canvas.addEventListener('click', (e) => {
      if (app.view !== 'system') return;
      const r = canvas.getBoundingClientRect();
      const b = this.pick(e.clientX - r.left, e.clientY - r.top);
      app.selectBody(b ? b.id : null);
    });
  }

  pick(x, y) {
    let best = null;
    let bd = Infinity;
    for (const h of this.hit) {
      const d = Math.hypot(h.x - x, h.y - y);
      if (d < Math.max(h.r + 5, 10) && d < bd) { bd = d; best = h.body; }
    }
    return best;
  }

  draw(w, h) {
    const { ctx } = this;
    const game = this.app.game;
    const sys = game.system(this.app.sel.sys);
    const cx = w / 2;
    const cy = h / 2;
    const outer = Math.max(...sys.bodies.map((b) => b.a), ...sys.stars.map((s) => s.sep), 1);
    const aMax = outer * 1.15;
    const rMax = Math.min(w, h) * 0.46;
    const R = (a) => (a <= 0 ? 0 : 22 + ((rMax - 22) * Math.log(1 + a / A0)) / Math.log(1 + aMax / A0));
    const primary = sys.stars[0];
    this.hit = [];

    // ハビタブルゾーンと雪線
    const hz = habitableZone(primary);
    if (!primary.wd && R(hz.inner) < rMax) {
      ctx.fillStyle = 'rgba(70,200,110,0.10)';
      ctx.beginPath();
      ctx.arc(cx, cy, R(hz.outer), 0, Math.PI * 2);
      ctx.arc(cx, cy, R(hz.inner), 0, Math.PI * 2, true);
      ctx.fill();
      ctx.fillStyle = 'rgba(110,220,150,0.7)';
      ctx.font = '10px sans-serif';
      ctx.fillText('ハビタブルゾーン', cx + R(hz.outer) * 0.7 + 4, cy - R(hz.outer) * 0.7);
    }
    const fl = frostLine(primary);
    if (R(fl) < rMax) {
      ctx.strokeStyle = 'rgba(140,200,255,0.35)';
      ctx.setLineDash([2, 5]);
      ctx.beginPath(); ctx.arc(cx, cy, R(fl), 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(140,200,255,0.55)';
      ctx.font = '10px sans-serif';
      ctx.fillText('雪線', cx - R(fl) * 0.7 - 24, cy - R(fl) * 0.7);
    }

    // 軌道リング
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(150,170,210,0.2)';
    for (const b of [...sys.bodies, ...sys.stars.slice(1).map((s) => ({ a: s.sep }))]) {
      ctx.beginPath(); ctx.arc(cx, cy, R(b.a), 0, Math.PI * 2); ctx.stroke();
    }

    // 恒星
    const drawStar = (star, x, y, big) => {
      const r = big ? clamp(7 + 5 * Math.log10(1 + star.radius * 3), 6, 22) : clamp(4 + 4 * Math.log10(1 + star.radius * 3), 4, 14);
      const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3.2);
      g.addColorStop(0, star.color);
      g.addColorStop(0.3, star.color);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r * 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = star.color;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      this.hit.push({ x, y, r, body: star });
      ctx.fillStyle = 'rgba(210,225,250,0.85)';
      ctx.font = '11px sans-serif';
      ctx.fillText(`${star.name} (${star.label})`, x + r + 6, y - r - 2);
      this.mark(star, x, y, r);
    };
    drawStar(primary, cx, cy, true);
    for (const s of sys.stars.slice(1)) {
      const ang = s.phase + (2 * Math.PI * game.year) / (Math.sqrt(s.sep ** 3 / (primary.mass + s.mass)) || 1);
      drawStar(s, cx + R(s.sep) * Math.cos(ang), cy + R(s.sep) * Math.sin(ang), false);
    }

    // 惑星・小惑星帯
    for (const b of sys.bodies) {
      const ang = b.phase + (2 * Math.PI * game.year) / b.period;
      const rr = R(b.a);
      const x = cx + rr * Math.cos(ang);
      const y = cy + rr * Math.sin(ang);
      let r;
      if (b.type === 'belt') {
        r = 7;
        ctx.strokeStyle = 'rgba(160,150,140,0.55)';
        ctx.lineWidth = 4;
        ctx.setLineDash([1, 5]);
        ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
        ctx.lineWidth = 1;
        const bx = cx + rr * Math.cos(b.phase);
        const by = cy + rr * Math.sin(b.phase);
        this.hit.push({ x: bx, y: by, r, body: b });
        this.label(b, bx, by, 4);
        this.mark(b, bx, by, 5);
        continue;
      }
      r = 3 + 5 * Math.log10(1 + b.radius);
      ctx.fillStyle = bodyColor(b);
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      if (b.type === 'gas-giant' || b.type === 'ice-giant') {
        ctx.strokeStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath(); ctx.moveTo(x - r, y - r * 0.3); ctx.lineTo(x + r, y - r * 0.3); ctx.moveTo(x - r, y + r * 0.35); ctx.lineTo(x + r, y + r * 0.35); ctx.stroke();
      }
      this.hit.push({ x, y, r, body: b });
      this.label(b, x, y, r);
      this.mark(b, x, y, r);
    }
  }

  label(b, x, y, r) {
    const { ctx } = this;
    ctx.fillStyle = b === this.hover || b.id === this.app.sel.body ? '#fff' : 'rgba(190,205,230,0.7)';
    ctx.font = '11px sans-serif';
    ctx.fillText(b.name.replace(/^.* (?=[a-z]$)/, ''), x + r + 4, y + 4);
  }

  // 入植地・選択状態の表示
  mark(b, x, y, r) {
    const { ctx } = this;
    const game = this.app.game;
    const sys = this.app.sel.sys;
    if (b.id === this.app.sel.body) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y, r + 5, 0, Math.PI * 2); ctx.stroke();
    }
    if (b.natives && game.isSurveyed(sys)) {
      ctx.strokeStyle = '#c9a2ff';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y, r + 2.5, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = 1;
    }
    if (game.colonyAt(sys, b.id, 'planet')) {
      ctx.fillStyle = '#4de3d0';
      ctx.beginPath(); ctx.moveTo(x, y - r - 9); ctx.lineTo(x + 4, y - r - 3); ctx.lineTo(x - 4, y - r - 3); ctx.fill();
    }
    if (game.colonyAt(sys, b.id, 'station')) {
      ctx.fillStyle = '#ffd24d';
      ctx.fillRect(x + r + 2, y - r - 6, 5, 5);
    }
    if (game.shipTo(sys, b.id, 'planet') || game.shipTo(sys, b.id, 'station')) {
      ctx.strokeStyle = '#ffb347';
      ctx.setLineDash([2, 3]);
      ctx.beginPath(); ctx.arc(x, y, r + 8, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}

// 右サイドパネル(星/天体の詳細と入植船の発進)のHTML生成。




const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function starRow(s) {
  return `<tr><td><span class="dot" style="background:${s.color}"></span>${esc(s.name)}</td><td>${s.label}</td>
    <td>${fmt(s.mass)} M☉</td><td>${Math.round(s.temp)} K</td><td>${fmt(s.lum, 3)} L☉</td></tr>`;
}

// 人口[百万人]の表示。例: 0.2 → 20万人、10000 → 100億人
function fmtPop(m) {
  if (m >= 100) return `${(m / 100).toFixed(m >= 1000 ? 0 : 1)}億人`;
  if (m >= 0.01) return `${(m * 100).toFixed(m >= 1 ? 0 : 1)}万人`;
  return `${Math.round(m * 1e6).toLocaleString()}人`;
}
function fmtAmt(v) {
  const a = Math.abs(v);
  if (a >= 1e6) return `${(v / 1e6).toFixed(1)}M`;
  if (a >= 1e4) return `${(v / 1e3).toFixed(0)}k`;
  if (a >= 1e3) return `${(v / 1e3).toFixed(1)}k`;
  return a >= 10 ? v.toFixed(0) : v.toFixed(1);
}
const pct = (v) => `${Math.round(v * 100)}%`;
const costText = (cost) => Object.entries(cost).map(([k, v]) => (k === 'credits' ? `${fmtAmt(v)} cr` : `${RES_LABEL[k]} ${fmtAmt(v)}`)).join('・');

// 費用つきボタン。払えないときは理由を添えて無効化する
function costButton(g, attrs, label, cost, sysId, extraReason = '') {
  const p = cost && !extraReason ? g.procure(cost, sysId) : null;
  const why = extraReason || p?.why || '';
  const sub = why || (cost ? costText(cost) + (p?.eta > 0 ? ` ・資材搬入 ${p.eta.toFixed(1)}年` : '') : '');
  return `<button ${attrs} ${why ? 'disabled' : ''}>${label}${sub ? `<small>${esc(sub)}</small>` : ''}</button>`;
}

function systemPanel(app) {
  const g = app.game;
  const sys = g.system(app.sel.sys);
  const home = g.system(0);
  const cols = g.coloniesIn(sys.id);
  const planets = sys.bodies.filter((b) => b.type !== 'belt').length;
  return `
    <h2>${esc(sys.name)}</h2>
    <p class="sub">太陽系から ${distance(home, sys).toFixed(1)} ly ・ 惑星 ${planets} ・ ${sys.stars.length > 1 ? `${sys.stars.length}重星系` : '単独星'}</p>
    <table class="tbl"><tr><th>恒星</th><th>型</th><th>質量</th><th>表面温度</th><th>光度</th></tr>${sys.stars.map(starRow).join('')}</table>
    ${sys.stars.slice(1).map((s) => `<p class="note">${esc(s.name)} は主星から約 ${fmt(s.sep)} AU</p>`).join('')}
    <h3>入植地</h3>
    ${cols.length ? `<ul>${cols.map((c) => `<li>${esc(c.name)} — ${KIND_LABEL[c.kind]} <span class="muted">人口 ${fmtPop(c.pop)}</span></li>`).join('')}</ul>` : '<p class="note">まだ入植していない</p>'}
    <button data-act="open">星系マップを開く</button>
    ${app.view === 'system' ? bodyList(app, sys) : ''}
    ${g.isColonized(sys.id) ? stockBox(g, sys.id) + routeBox(app, sys) : ''}
    ${militaryBox(app, sys)}
    ${nativesSummary(g, sys)}`;
}

function bodyList(app, sys) {
  const g = app.game;
  return `<h3>天体</h3><ul class="bodies">${sys.bodies.map((b) => {
    const mark = ['planet', 'station'].filter((k) => g.colonyAt(sys.id, b.id, k)).map((k) => (k === 'planet' ? '▲' : '■')).join('');
    const nat = b.natives && g.isSurveyed(sys.id) ? ' <span class="nat">先住民</span>' : '';
    return `<li data-body="${b.id}" class="${b.id === app.sel.body ? 'sel' : ''}"><span class="dot" style="background:${bodyColor(b)}"></span>${esc(b.name)}${nat}
      <span class="muted">${TYPE_LABEL[b.type]} ${fmt(b.a)} AU</span> <span class="mk">${mark}</span></li>`;
  }).join('')}</ul>`;
}

// 星系の備蓄と年あたりの生産・需要
function stockBox(g, sysId) {
  const st = g.stockOf(sysId);
  const fl = g.flow[sysId] || { prod: zeroRes(), cons: zeroRes() };
  const rows = RES.map((r) => {
    const net = fl.prod[r] - fl.cons[r];
    const cls = net < -0.001 && st[r] < fl.cons[r] ? 'bad' : '';
    return `<tr><td>${RES_LABEL[r]}</td><td>${fmtAmt(st[r])}</td><td>${fmtAmt(fl.prod[r])}</td><td class="${cls}">${fmtAmt(fl.cons[r])}</td></tr>`;
  }).join('');
  return `<h3>星系の備蓄 (生産・需要は年あたり)</h3>
    <table class="tbl"><tr><th>資源</th><th>備蓄</th><th>生産</th><th>需要</th></tr>${rows}</table>`;
}

function routeBox(app, sys) {
  const g = app.game;
  const mine = g.routes.filter((r) => r.a === sys.id || r.b === sys.id);
  const others = g.colonizedSystems()
    .filter((s) => s.id !== sys.id && !g.routeBetween(s.id, sys.id))
    .sort((a, b) => distance(a, sys) - distance(b, sys));
  const list = mine.map((r) => {
    const out = r.a === sys.id ? 0 : 1;
    const other = g.system(r.a === sys.id ? r.b : r.a);
    return `<div class="route"><b>⇄ ${esc(other.name)}</b> <span class="muted">${distance(sys, other).toFixed(1)} ly ・ Lv${r.lv} (片道 ${fmtAmt(g.routeCap(r))}/年)</span><br>
      <span class="muted">送り ${fmtAmt(r.vol[out])}/年 ・ 受け取り ${fmtAmt(r.vol[1 - out])}/年</span>
      ${costButton(g, `data-act="uproute" data-route="${r.id}"`, '拡張', g.routeUpCost(r), r.a, busyText(g, (j) => j.type === 'route' && j.route === r.id))}</div>`;
  }).join('');
  const dest = others.some((s) => s.id === app.routeDest) ? app.routeDest : others[0]?.id;
  const open = others.length
    ? `<label class="field">相手の星系
        <select data-act="rdest">${others.map((s) => `<option value="${s.id}" ${s.id === dest ? 'selected' : ''}>${esc(s.name)} (${distance(s, sys).toFixed(1)} ly)</option>`).join('')}</select></label>
       ${costButton(g, `data-act="route" data-dest="${dest}"`, '交易路を開設', g.routeCost(sys.id, dest))}`
    : '<p class="note">交易路を結べる相手(他の入植星系)がない</p>';
  return `<h3>交易路</h3>
    <p class="note">余っている資源を、足りない側へ自動で運ぶ (光速の貨物船)。運んだ荷の価値の1割が交易収入になる。</p>
    ${list}${open}`;
}

function militaryBox(app, sys) {
  const g = app.game;
  const n = g.garrison[sys.id] || 0;
  const origins = Object.entries(g.garrison)
    .map(([id, k]) => ({ s: g.system(Number(id)), k }))
    .filter((o) => o.k > 0 && o.s.id !== sys.id)
    .sort((a, b) => distance(a.s, sys) - distance(b.s, sys));
  const from = origins.some((o) => o.s.id === app.fleetOrigin) ? app.fleetOrigin : origins[0]?.s.id;
  const build = g.isColonized(sys.id)
    ? costButton(g, 'data-act="warship"', '軍艦を建造', WARSHIP_COST, sys.id, g.hasShipyard(sys.id) ? '' : '造船所がない (入植地で建設できる)')
    : '';
  const send = origins.length
    ? `<label class="field">艦隊の出発地
        <select data-act="forigin">${origins.map((o) => `<option value="${o.s.id}" ${o.s.id === from ? 'selected' : ''}>${esc(o.s.name)} (${o.k}隻・${g.travelYears(o.s.id, sys.id).toFixed(1)} 年)</option>`).join('')}</select></label>
       <div class="btns"><button data-act="fleet" data-from="${from}" data-n="1">1隻をここへ</button><button data-act="fleet" data-from="${from}" data-n="all">全艦をここへ</button></div>`
    : '';
  const queued = g.projects.filter((j) => j.type === 'warship' && j.sys === sys.id).length;
  return `<h3>軍事</h3>
    <p class="note">駐留艦 <b>${n}</b> 隻${queued ? ` (建造中 ${queued} 隻)` : ''}。宇宙海賊の襲撃 (${PIRATE_START}年以降) を防ぎ、先住民の制圧にも使う。1隻あたり維持費 ${WARSHIP_UPKEEP} cr/年</p>
    ${build}${send}`;
}

function nativesSummary(g, sys) {
  if (!g.isSurveyed(sys.id)) return '';
  const list = sys.bodies.filter((b) => b.natives).map((b) => {
    const n = g.nativeOf(sys.id, b.id);
    return `<li>${esc(b.name)}: ${esc(n.def.species)} <span class="muted">${fmtPop(n.st.pop)}・${TECH_LABEL[n.def.tech]}・${nativeStatus(n)}</span></li>`;
  });
  return list.length ? `<h3>先住民</h3><ul>${list.join('')}</ul>` : '';
}

function nativeStatus(n) {
  if (n.st.status === 'integrated') return '市民として統合済み';
  if (n.st.status === 'subjugated') return '支配下';
  return `${relLabel(n.st.rel)} (${Math.round(n.st.rel)})`;
}

function row(k, v) { return `<tr><th>${k}</th><td>${v}</td></tr>`; }

function bodyPanel(app) {
  const g = app.game;
  const sys = g.system(app.sel.sys);
  const b = g.target(sys.id, app.sel.body);
  if (!b) return systemPanel(app);
  const isStar = !!b.label;
  let info;
  if (isStar) {
    info = `<table class="tbl kv">${row('スペクトル型', b.label)}${row('質量', `${fmt(b.mass)} M☉`)}${row('半径', `${fmt(b.radius, 3)} R☉`)}
      ${row('表面温度', `${Math.round(b.temp)} K`)}${row('光度', `${fmt(b.lum, 3)} L☉`)}${b.sep ? row('主星からの距離', `${fmt(b.sep)} AU`) : ''}</table>`;
  } else if (b.type === 'belt') {
    info = `<table class="tbl kv">${row('種類', TYPE_LABEL.belt)}${row('軌道半径', `${fmt(b.a)} AU`)}${row('公転周期', `${fmt(b.period)} 年`)}</table>`;
  } else {
    const solid = b.type === 'rocky' || b.type === 'dwarf';
    info = `<table class="tbl kv">${row('種類', TYPE_LABEL[b.type])}${row('軌道半径', `${fmt(b.a)} AU${b.inHZ ? ' <span class="hz">(HZ内)</span>' : ''}`)}
      ${row('公転周期', `${fmt(b.period)} 年${b.tidalLock ? ' (潮汐固定)' : ''}`)}${row('質量', `${fmt(b.mass)} M⊕`)}${row('半径', `${fmt(b.radius)} R⊕`)}
      ${row(solid ? '表面重力' : '重力(1気圧面)', `${fmt(b.gravity)} g`)}${row('平衡温度', `${Math.round(b.teq)} K`)}
      ${solid ? row('表面温度', `${Math.round(b.tSurf)} K (${Math.round(b.tSurf - 273)} ℃)`) : ''}
      ${solid ? row('大気圧', b.pressure < 0.001 ? 'ほぼ真空' : `${fmt(b.pressure)} atm`) : ''}
      ${solid ? row('地表', SURFACE_LABEL[b.surface] || '') : ''}
      ${solid ? row('入植適性', `<b class="grade g${b.settle.grade}">${GRADE_LABEL[b.settle.grade]}</b>${b.settle.notes.length ? ` — ${b.settle.notes.join('、')}` : ''}`) : ''}</table>`;
  }
  const cols = ['planet', 'station'].map((k) => g.colonyAt(sys.id, b.id, k)).filter(Boolean);
  return `
    <h2><span class="dot big" style="background:${isStar ? b.color : bodyColor(b)}"></span>${esc(b.name)}</h2>
    <p class="sub">${esc(sys.name)}</p>
    ${info}
    ${depositRow(b)}
    ${nativesBox(app, sys, b)}
    ${cols.map((c) => colonyBox(g, c)).join('')}
    ${dispatchBox(app, sys, b)}
    <button data-act="back" class="ghost">← 星系の一覧へ</button>`;
}

function depositRow(b) {
  const d = b.deposits || {};
  const has = MINED.filter((r) => d[r] > 0.05);
  const stars = (v) => '★'.repeat(clamp(Math.ceil(v / 0.6), 1, 4));
  return `<h3>資源</h3><p class="note">${has.length ? has.map((r) => `${RES_LABEL[r]} <span class="hz">${stars(d[r])}</span>`).join('　') : '採掘できる資源はない'}</p>`;
}

function colonyBox(g, c) {
  const key = colKey(c);
  const cap = g.capOf(c);
  const s = c.sat || { food: 1, water: 1, goods: 1 };
  const warn = [];
  if (s.food < 0.99) warn.push('食料');
  if (g.needsWater(c) && s.water < 0.99) warn.push('水');
  const facs = Object.keys(FACILITY).map((f) => {
    const max = c.lv[f] >= FACILITY_MAX[f];
    const busy = busyText(g, (j) => j.type === 'upgrade' && j.col === key && j.fac === f);
    return `<div class="fac"><span>${FACILITY[f]} <b>Lv${c.lv[f]}</b></span>
      ${costButton(g, `data-act="upgrade" data-col="${key}" data-fac="${f}"`, max ? '最大' : '拡張', max ? null : g.upgradeCost(c, f), c.sys, max ? '最大レベル' : busy)}</div>`;
  }).join('');
  return `<h3>${KIND_LABEL[c.kind]}</h3>
    <table class="tbl kv">
      ${row('人口', `${fmtPop(c.pop)} / 上限 ${fmtPop(cap)}`)}
      ${row('人口増加', `<span class="${(c.growth || 0) < 0 ? 'bad' : 'hz'}">${((c.growth || 0) * 100).toFixed(1)}%/年</span>`)}
      ${row('充足率', `食料 ${pct(s.food)}${g.needsWater(c) ? `・水 ${pct(s.water)}` : ''}・工業品 ${pct(s.goods)}`)}
      ${row('工場の稼働', pct(c.industry ?? 1))}
    </table>
    ${warn.length ? `<p class="note bad">${warn.join('・')}が足りず人口が減っている。方針を変えるか、交易路で運び込もう。</p>` : ''}
    <label class="field">方針 (労働力の配分)
      <select data-act="focus" data-col="${key}">${Object.entries(FOCUS).map(([k, f]) => `<option value="${k}" ${k === c.focus ? 'selected' : ''}>${f.label} — 農${pct(f.farm)}・鉱${pct(f.mine)}・工${pct(f.ind)}</option>`).join('')}</select></label>
    <div class="facs">${facs}</div>`;
}

function nativesBox(app, sys, b) {
  const g = app.game;
  const lush = b.surface === 'temperate' || b.surface === 'ocean';
  if (!g.isSurveyed(sys.id)) {
    return lush && b.settle?.grade >= 2 ? '<h3>先住民</h3><p class="note">未調査。入植地を作るか艦隊が到達すると分かる。</p>' : '';
  }
  const n = g.nativeOf(sys.id, b.id);
  if (!n) return '';
  const ind = n.st.status === 'independent';
  const need = g.nativeDefense(n);
  const presence = g.isColonized(sys.id);
  const col = g.colonyAt(sys.id, b.id, 'planet');
  const actions = ind ? `<div class="btns">
      ${costButton(g, 'data-act="gift"', '贈り物 (友好度+10)', GIFT_COST, undefined, presence ? '' : 'この星系に拠点が必要')}
      ${costButton(g, 'data-act="integrate"', '市民として迎える', null, undefined, !col ? '同じ惑星に入植地が必要' : n.st.rel < 80 ? '友好度80以上が必要' : '')}
    </div>
    ${costButton(g, 'data-act="conquer"', `武力で制圧 (軍艦 ${need} 隻以上)`, null, undefined, (g.garrison[sys.id] || 0) < need ? `駐留艦が足りない (${g.garrison[sys.id] || 0}/${need})` : '')}` : '';
  return `<h3>先住民</h3>
    <table class="tbl kv">
      ${row('種族', esc(n.def.species))}${row('人口', fmtPop(n.st.pop))}${row('文明', TECH_LABEL[n.def.tech])}
      ${row('関係', nativeStatus(n))}
    </table>
    ${ind ? `<p class="note">拠点があると友好度は少しずつ上がる。40以上で惑星への入植と交易 (収入・希少元素) が可能。80以上なら市民として迎えられる。制圧すると貢納を得るが、他の先住民の友好度が下がる。</p>` : ''}
    ${actions}`;
}

function dispatchBox(app, sys, b) {
  const g = app.game;
  const origins = g.colonizedSystems()
    .map((s) => ({ s, t: g.travelYears(s.id, sys.id) }))
    .sort((a, c) => a.t - c.t);
  const sel = app.originId !== undefined && origins.some((o) => o.s.id === app.originId) ? app.originId : origins[0].s.id;
  const t = g.travelYears(sel, sys.id);
  const btn = (kind) => {
    const c = g.check(sys.id, b.id, kind);
    return costButton(g, `data-act="send" data-kind="${kind}"`, `${KIND_LABEL[kind]}を建設`, SHIP_COST[kind], sel, c.ok ? '' : c.reason);
  };
  return `<h3>入植船を送る</h3>
    <label class="field">出発地
      <select data-act="origin">${origins.map((o) => `<option value="${o.s.id}" ${o.s.id === sel ? 'selected' : ''}>${esc(o.s.name)} (${o.t < 0.01 ? '星系内' : `${o.t.toFixed(1)} 年`})</option>`).join('')}</select></label>
    <p class="note">入植船は光速で航行。到着まで <b>${t < 0.01 ? 'ほぼ即時' : `${t.toFixed(2)} 年`}</b>。費用は出発地の備蓄から払う。</p>
    <div class="btns">${btn('station')}${btn('planet')}</div>`;
}

// 建設中ならボタンに添える文言 (例: 建設中 あと 3.2 年)
function busyText(g, pred) {
  const j = g.pending(pred);
  return j ? `建設中 あと ${(j.ready - g.year).toFixed(1)} 年` : '';
}

function shipsHtml(game) {
  const bar = (s) => {
    const f = (game.year - s.depart) / (s.arrive - s.depart);
    return `<span class="bar"><i style="width:${(f * 100).toFixed(0)}%"></i></span> あと ${(s.arrive - game.year).toFixed(1)} 年`;
  };
  const ships = game.ships.map((s) => `<div class="ship">${esc(game.system(s.from).name)} → ${esc(game.system(s.to).name)} <span class="muted">${KIND_LABEL[s.kind]}</span>${bar(s)}</div>`);
  const fleets = game.fleets.map((f) => `<div class="ship">${esc(game.system(f.from).name)} → ${esc(game.system(f.to).name)} <span class="bad">艦隊 ${f.n}隻</span>${bar(f)}</div>`);
  const jobs = game.projects.map((j) => `<div class="ship">${esc(j.label)} <span class="muted">資材搬入中</span>${bar({ depart: j.start, arrive: j.ready })}</div>`);
  const all = [...jobs, ...ships, ...fleets];
  return all.length ? all.join('') : '<span class="muted">航行中の船なし</span>';
}

// 帝国タブ: 全星系の人口・資源・経済・軍事を一覧で管理する
function empireHtml(app) {
  const g = app.game;
  const systems = g.colonizedSystems().sort((a, b) => g.coloniesIn(b.id).reduce((s, c) => s + c.pop, 0) - g.coloniesIn(a.id).reduce((s, c) => s + c.pop, 0));
  const net = (fl, r) => fl.prod[r] - fl.cons[r];
  const flowOf = (id) => g.flow[id] || { prod: zeroRes(), cons: zeroRes() };
  const signed = (v) => (Math.abs(v) < 0.05 ? '<span class="muted">±0</span>' : `<span class="${v < 0 ? 'bad' : 'hz'}">${v > 0 ? '+' : ''}${fmtAmt(v)}</span>`);
  const goto = (s) => `<button data-act="goto" data-sys="${s.id}">${esc(s.name)}</button>`;
  const inc = g.income();

  const kpi = `<div class="kpi">
    <div><span>クレジット</span><b>${fmtAmt(g.credits)} cr</b><span class="${inc < 0 ? 'bad' : 'hz'}">${inc >= 0 ? '+' : ''}${fmtAmt(inc)}/年</span></div>
    <div><span>総人口</span><b>${fmtPop(g.totalPop())}</b><span>入植地 ${g.colonies.length}・星系 ${systems.length}</span></div>
    <div><span>軍艦</span><b>${g.warships()} 隻</b><span>維持費 ${fmtAmt(g.warships() * WARSHIP_UPKEEP)} cr/年</span></div>
    <div><span>交易路</span><b>${g.routes.length} 本</b><span>輸送中 ${g.cargo.length} 便</span></div>
  </div>`;

  const ledger = `<h3>収支 (cr/年)</h3><table class="tbl">${ledgerHtml(g)}</table>`;

  const colonies = [...g.colonies].sort((a, b) => b.pop - a.pop).map((c) => {
    const s = c.sat || { food: 1, water: 1, goods: 1 };
    const low = Math.min(s.food, g.needsWater(c) ? s.water : 1);
    return `<tr><td>${esc(c.name)}</td><td>${goto(g.system(c.sys))}</td><td>${c.kind === 'planet' ? '惑星' : 'ステーション'}</td>
      <td>${fmtPop(c.pop)}</td><td class="muted">${fmtPop(g.capOf(c))}</td>
      <td class="${(c.growth || 0) < 0 ? 'bad' : 'hz'}">${((c.growth || 0) * 100).toFixed(1)}%</td>
      <td class="${low < 0.99 ? 'bad' : ''}">${pct(low)}</td><td class="${s.goods < 0.99 ? 'bad' : ''}">${pct(s.goods)}</td>
      <td><select data-act="focus" data-col="${colKey(c)}">${Object.entries(FOCUS).map(([k, f]) => `<option value="${k}" ${k === c.focus ? 'selected' : ''}>${f.label}</option>`).join('')}</select></td></tr>`;
  }).join('');
  const bulk = `<div class="bulk">全入植地の方針を
    <select data-act="bulkfocus">${Object.entries(FOCUS).map(([k, f]) => `<option value="${k}" ${k === (app.bulkFocus || 'balanced') ? 'selected' : ''}>${f.label}</option>`).join('')}</select>
    <button data-act="bulkfocus">一括で変更</button></div>`;
  const popTable = `<h3>人口と入植地</h3>${bulk}<div class="scroll"><table class="tbl">
    <tr><th>入植地</th><th>星系</th><th>種類</th><th>人口</th><th>上限</th><th>増加/年</th><th>生活物資</th><th>工業品</th><th>方針</th></tr>${colonies}</table></div>`;

  const totals = zeroRes();
  const totalNet = zeroRes();
  const resRows = systems.map((s) => {
    const st = g.stockOf(s.id);
    const fl = flowOf(s.id);
    return `<tr><td>${goto(s)}</td>${RES.map((r) => {
      totals[r] += st[r];
      totalNet[r] += net(fl, r);
      return `<td>${fmtAmt(st[r])} <small>${signed(net(fl, r))}</small></td>`;
    }).join('')}</tr>`;
  }).join('');
