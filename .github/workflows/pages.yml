name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # ゲーム版 (index.html) は、リポジトリに入れずに、ここで src から組み立てる (回 R3。docs/restart.md の 5)。
      # シミュレーション版 (simulation.html) は凍結中なので、リポジトリに入っているものをそのまま載せる
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ゲーム版を組み立てる
        run: |
          cd tools && npm ci && cd ..
          node tools/build.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
