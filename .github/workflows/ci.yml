name: 試験と自動対戦

# PR ごとに: 組み立てたゲーム版が元のファイルと合っているか・試験・合わせる目標の固定・画面なしの版での自動対戦 (main との比べ)。
# 結果の表は、ジョブの要約と PR のコメント (1 つを書き直す) に出す
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 道具を入れる
        run: |
          cd tools && npm ci
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: 試験
        id: tests
        run: node tools/ci-tests.js > ci-tests.md
      - name: 自動対戦 (main と比べる)
        if: always()
        run: |
          git show origin/${{ github.base_ref || 'main' }}:src/index.html > base-src.html
          node tools/ci-report.js base-src.html src/index.html 8 150 6 > ci-report.md
      - name: 表を出す
        if: always()
        run: |
          { cat ci-tests.md 2>/dev/null; echo; cat ci-report.md 2>/dev/null; } > ci-summary.md
          cat ci-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: PR に書く
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const mark = '<!-- nlu-ci -->';
            const body = `${mark}\n## 試験と自動対戦 (${context.sha.slice(0, 7)})\n\n${fs.readFileSync('ci-summary.md', 'utf8')}\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find((c) => c.body.startsWith(mark));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
      - name: 落ちた試験があれば失敗にする
        if: steps.tests.outcome == 'failure'
        run: exit 1
